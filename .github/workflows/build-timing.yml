name: build-timing
on:
    push:
        branches: ['perf/r2-timing']
jobs:
    timing:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Machine
              run: nproc; free -g; node -e "console.log(require('os').availableParallelism())"
            - name: Prepare one worktree per variant
              run: |
                  while read -r name ref; do
                    [ -z "$name" ] && continue
                    git worktree add -q "../v-$name" "origin/$ref" || git worktree add -q "../v-$name" "$ref"
                    (cd "../v-$name" && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
                    echo "$name $(git -C ../v-$name log --oneline -1)"
                  done < .github/build-timing-variants.txt
            - name: Interleaved cold and warm builds of markless.dev
              run: node .github/build-timing.mjs
