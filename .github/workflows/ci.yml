name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    agent-files:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Verify committed agent files match .ruler/ sources
              run: |
                  pnpm dlx @intellectronica/ruler apply
                  DRIFT="$(git status --porcelain -- AGENTS.md CLAUDE.md .claude/skills .codex/skills .mcp.json .codex/config.toml)"
                  if [ -n "$DRIFT" ]; then
                      echo "::error::Committed agent files are out of sync with .ruler/. Run 'pnpm rules' and commit the result."
                      git status --porcelain -- AGENTS.md CLAUDE.md .claude/skills .codex/skills .mcp.json .codex/config.toml
                      exit 1
                  fi

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers for the vitest browser project
              run: pnpm --dir packages/vitest-browser exec playwright install --with-deps chromium

            - name: Run unit and integration tests
              run: pnpm exec vp test

            - name: Generate analyzer unit-contract receipts
              run: pnpm receipts:generate

            - name: Run bundler pipeline boxes
              run: pnpm --dir packages/bundler test:boxes

            - name: Run router pipeline boxes
              run: pnpm --dir packages/router test:boxes

            - name: Validate required analyzer consumer receipts
              run: pnpm receipts:check

            - name: Upload analyzer contract receipts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: analyzer-contract-receipts
                  path: packages/*/.witness/receipts/*.json
                  if-no-files-found: error

            - name: Run music-player demo boxes
              run: pnpm --dir demos/music-player test:boxes

            - name: Run music-player-ssr demo boxes
              run: pnpm --dir demos/music-player-ssr test:boxes

    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            bench: ${{ steps.filter.outputs.bench }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Decide whether benchmarks can be affected
              id: filter
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                    base="${{ github.event.pull_request.base.sha }}"
                  else
                    base="${{ github.event.before }}"
                  fi
                  bench=true
                  if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                    changed=$(git diff --name-only "$base" HEAD)
                    # Skip benchmarking only when every changed file is docs/spec-only.
                    if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(specs/|docs/|\.claude/|\.codex/|LICENSE$|.*\.md$)'; then
                      bench=false
                    fi
                  fi
                  echo "bench=$bench" >> "$GITHUB_OUTPUT"
                  echo "benchmarks needed: $bench"

    benchmark:
        needs: changes
        if: needs.changes.outputs.bench == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: select
                      benchmarks: 04_
                    - shard: create
                      benchmarks: 01_ 07_ 40_
                    - shard: update
                      benchmarks: 02_ 03_ 05_
                    - shard: list
                      benchmarks: 06_ 08_ 09_
        env:
            MARKLESS_CI_TEMP: /tmp/markless-ci-${{ github.run_id }}
            MARKLESS_REPO_ROOT: ${{ github.workspace }}
            MARKLESS_BASE_REPO_ROOT: /tmp/markless-ci-${{ github.run_id }}/markless-baseline
            JSFB_ROOT: /tmp/markless-ci-${{ github.run_id }}/js-framework-benchmark
            MARKLESS_JSFB_BASELINE_RESULTS: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/results-markless-base
            MARKLESS_JSFB_RESULTS: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/results-markless-ci
            MARKLESS_JSFB_BASELINE_TRACES: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/traces-markless-base
            MARKLESS_JSFB_TRACES: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/traces-markless-ci
            JSFB_SERVER_LOG: /tmp/markless-ci-${{ github.run_id }}/jsfb-server.log
            MARKLESS_JSFB_CI_COUNT: '5'
            MARKLESS_JSFB_BENCHMARKS: ${{ matrix.benchmarks }}
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare CI temp directory
              run: mkdir -p "$MARKLESS_CI_TEMP"

            - name: Resolve benchmark baseline revision
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                    echo "MARKLESS_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
                  else
                    echo "MARKLESS_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
                  fi

            - name: Checkout benchmark baseline revision
              run: git worktree add "$MARKLESS_BASE_REPO_ROOT" "$MARKLESS_BASE_SHA"

            - name: Install baseline Markless dependencies
              working-directory: ${{ env.MARKLESS_BASE_REPO_ROOT }}
              run: pnpm install --frozen-lockfile

            - name: Checkout JS Framework Benchmark
              run: git clone --depth 1 https://github.com/krausest/js-framework-benchmark.git "$JSFB_ROOT"

            - name: Cache JS Framework Benchmark npm downloads
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: jsfb-npm-${{ runner.os }}-node24-v1
                  restore-keys: |
                      jsfb-npm-${{ runner.os }}-node24-

            - name: Install JS Framework Benchmark dependencies
              working-directory: ${{ env.JSFB_ROOT }}
              run: |
                  npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
                  npm run install-webdriver-ts
                  npm run install-server

            - name: Install Markless benchmark fixture
              run: pnpm bench:jsfb:prepare -- --jsfb-root "$JSFB_ROOT"

            - name: Start JS Framework Benchmark server
              working-directory: ${{ env.JSFB_ROOT }}
              run: |
                  npm start > "$JSFB_SERVER_LOG" 2>&1 &
                  for attempt in {1..60}; do
                    if curl -fsS http://localhost:8080/ls > /dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done
                  cat "$JSFB_SERVER_LOG"
                  exit 1

            # Baseline and current run back-to-back per benchmark so both sides
            # of each guard ratio see the same runner speed; separated passes
            # drift several percent on hosted runners and flake the guard.
            - name: Run interleaved baseline/current benchmark pairs
              working-directory: ${{ env.JSFB_ROOT }}
              run: |
                  set -o pipefail
                  mkdir -p "$MARKLESS_CI_TEMP/markless-jsfb" \
                    "$MARKLESS_JSFB_BASELINE_RESULTS" "$MARKLESS_JSFB_RESULTS" \
                    "$MARKLESS_JSFB_BASELINE_TRACES" "$MARKLESS_JSFB_TRACES"

                  run_side() {
                    side="$1"; bench="$2"; repo_root="$3"; results_dir="$4"; traces_dir="$5"
                    rm -rf webdriver-ts/results webdriver-ts/traces
                    MARKLESS_REPO_ROOT="$repo_root" node --input-type=module -e "import { rebuildFrameworks } from './cli/rebuild-build-single.js'; if (!rebuildFrameworks(['keyed/markless'], true)) process.exit(1);"
                    MARKLESS_REPO_ROOT="$repo_root" npm run bench -- \
                      --headless \
                      --framework keyed/markless \
                      --count "$MARKLESS_JSFB_CI_COUNT" \
                      --benchmark "$bench" \
                      2>&1 | tee "$RUNNER_TEMP/jsfb-bench-$side-$bench.log"
                    if grep -Fq "Frameworks that will be benchmarked []" "$RUNNER_TEMP/jsfb-bench-$side-$bench.log"; then
                      exit 1
                    fi
                    if ! compgen -G "webdriver-ts/results/*markless*-keyed_*.json" > /dev/null; then
                      exit 1
                    fi
                    mv webdriver-ts/results/* "$results_dir"/
                    if compgen -G "webdriver-ts/traces/*" > /dev/null; then
                      mv webdriver-ts/traces/* "$traces_dir"/
                    fi
                  }

                  for bench in $MARKLESS_JSFB_BENCHMARKS; do
                    run_side baseline "$bench" "$MARKLESS_BASE_REPO_ROOT" "$MARKLESS_JSFB_BASELINE_RESULTS" "$MARKLESS_JSFB_BASELINE_TRACES"
                    run_side current "$bench" "$MARKLESS_REPO_ROOT" "$MARKLESS_JSFB_RESULTS" "$MARKLESS_JSFB_TRACES"
                  done

            - name: Upload JSFB shard results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: markless-jsfb-results-${{ matrix.shard }}
                  path: |
                      ${{ env.MARKLESS_JSFB_BASELINE_RESULTS }}
                      ${{ env.MARKLESS_JSFB_RESULTS }}
                      ${{ env.MARKLESS_JSFB_BASELINE_TRACES }}
                      ${{ env.MARKLESS_JSFB_TRACES }}
                      ${{ env.JSFB_SERVER_LOG }}

    benchmark-guard:
        needs: [changes, benchmark]
        if: needs.changes.outputs.bench == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            MARKLESS_JSFB_BASELINE_RESULTS: ${{ github.workspace }}/.jsfb-merged/markless-jsfb/results-markless-base
            MARKLESS_JSFB_RESULTS: ${{ github.workspace }}/.jsfb-merged/markless-jsfb/results-markless-ci
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Download JSFB shard results
              uses: actions/download-artifact@v4
              with:
                  pattern: markless-jsfb-results-*
                  merge-multiple: true
                  path: .jsfb-merged

            - name: Compare benchmark results against baseline
              run: node scripts/benchmarks/jsfb-baseline.mjs compare
