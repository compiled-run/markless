name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    agent-files:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Verify committed agent files match .ruler/ sources
              run: |
                  pnpm dlx @intellectronica/ruler apply
                  DRIFT="$(git status --porcelain -- AGENTS.md CLAUDE.md .claude/skills .codex/skills .mcp.json .codex/config.toml)"
                  if [ -n "$DRIFT" ]; then
                      echo "::error::Committed agent files are out of sync with .ruler/. Run 'pnpm rules' and commit the result."
                      git status --porcelain -- AGENTS.md CLAUDE.md .claude/skills .codex/skills .mcp.json .codex/config.toml
                      exit 1
                  fi

    # Fast static gate in front of the 30-minute `test` job, so type red kills
    # the run in seconds instead of half an hour. tsc is the gate of record;
    # `vp check --no-fmt` adds the lint stage (fmt is excluded: the tree has
    # pre-existing formatting drift that is scheduled separately).
    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm exec tsc --noEmit -p tsconfig.json

            - name: Lint
              run: pnpm exec vp check --no-fmt

    # Content-hash gate in front of every lane. Each lane's inputs are hashed
    # into a cache key and probed read-only; a lane whose key already has a
    # green marker saved against it is skipped instead of re-run. `.github/**`
    # and `scripts/ci/**` are deliberately outside the base key, so CI-only
    # edits do not invalidate every lane. Nothing installs in this job, so the
    # globs below see a clean checkout with no node_modules or dist to hash.
    lanes:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            key_unit: ${{ steps.unit.outputs.cache-primary-key }}
            run_unit: ${{ steps.unit.outputs.cache-hit != 'true' }}
            key_browser: ${{ steps.browser.outputs.cache-primary-key }}
            run_browser: ${{ steps.browser.outputs.cache-hit != 'true' }}
            key_completion_matrix: ${{ steps.completion_matrix.outputs.cache-primary-key }}
            run_completion_matrix: ${{ steps.completion_matrix.outputs.cache-hit != 'true' }}
            key_boxes_bundler: ${{ steps.boxes_bundler.outputs.cache-primary-key }}
            run_boxes_bundler: ${{ steps.boxes_bundler.outputs.cache-hit != 'true' }}
            key_boxes_router: ${{ steps.boxes_router.outputs.cache-primary-key }}
            run_boxes_router: ${{ steps.boxes_router.outputs.cache-hit != 'true' }}
            key_boxes_music_player: ${{ steps.boxes_music_player.outputs.cache-primary-key }}
            run_boxes_music_player: ${{ steps.boxes_music_player.outputs.cache-hit != 'true' }}
            key_boxes_music_player_ssr: ${{ steps.boxes_music_player_ssr.outputs.cache-primary-key }}
            run_boxes_music_player_ssr: ${{ steps.boxes_music_player_ssr.outputs.cache-hit != 'true' }}
            key_receipts: ${{ steps.receipts.outputs.cache-primary-key }}
            run_receipts: ${{ steps.receipts.outputs.cache-hit != 'true' }}
            run_playwright:
                ${{ steps.browser.outputs.cache-hit != 'true' || steps.boxes_bundler.outputs.cache-hit
                != 'true' || steps.boxes_router.outputs.cache-hit != 'true' ||
                steps.boxes_music_player.outputs.cache-hit != 'true' ||
                steps.boxes_music_player_ssr.outputs.cache-hit != 'true' }}

        steps:
            - uses: actions/checkout@v4

            # Shared inputs every lane depends on. Its evaluated key is written
            # to a file so the per-lane keys below layer on top of it.
            - name: Probe the shared input hash
              id: base
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: ci-base-key.txt
                  key:
                      markless-base-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml',
                      'package.json', 'tsconfig.json', 'vite.config.ts', 'packages/*/src/**/*',
                      'scripts/**/*', '!scripts/ci/**') }}

            - name: Record the shared input hash
              run: echo '${{ steps.base.outputs.cache-primary-key }}' > ci-base-key.txt

            - name: Probe the unit lane
              id: unit
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: unit-completed.txt
                  key:
                      unit-${{ hashFiles('ci-base-key.txt', 'packages/*/test/**/*',
                      'packages/*/test-support/**/*') }}

            - name: Probe the browser lane
              id: browser
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: browser-completed.txt
                  key:
                      browser-${{ hashFiles('ci-base-key.txt', 'packages/vitest-browser/**/*',
                      'packages/headless/**/*', 'packages/*/fixtures/**/*',
                      'packages/*/test-support/**/*', '!**/node_modules/**', '!**/dist/**') }}

            - name: Probe the completion-matrix lane
              id: completion_matrix
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: completion-matrix-completed.txt
                  key:
                      completion-matrix-${{ hashFiles('ci-base-key.txt', 'packages/typescript-plugin/**/*',
                      '!**/node_modules/**', '!**/dist/**') }}

            - name: Probe the bundler box lane
              id: boxes_bundler
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: boxes-bundler-completed.txt
                  key:
                      boxes-bundler-${{ hashFiles('ci-base-key.txt', 'packages/bundler/**/*',
                      '!**/node_modules/**', '!**/dist/**', '!**/.witness/**') }}

            - name: Probe the router box lane
              id: boxes_router
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: boxes-router-completed.txt
                  key:
                      boxes-router-${{ hashFiles('ci-base-key.txt', 'packages/router/**/*',
                      '!**/node_modules/**', '!**/dist/**', '!**/.witness/**') }}

            - name: Probe the music-player box lane
              id: boxes_music_player
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: boxes-music-player-completed.txt
                  key:
                      boxes-music-player-${{ hashFiles('ci-base-key.txt', 'demos/music-player/**/*',
                      '!**/node_modules/**', '!**/dist/**', '!**/.witness/**') }}

            - name: Probe the music-player-ssr box lane
              id: boxes_music_player_ssr
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: boxes-music-player-ssr-completed.txt
                  key:
                      boxes-music-player-ssr-${{ hashFiles('ci-base-key.txt', 'demos/music-player-ssr/**/*',
                      '!**/node_modules/**', '!**/dist/**', '!**/.witness/**') }}

            # The receipt set is the union of what the box lanes wrote, so every
            # box key feeds this one: a box lane that re-runs re-runs receipts.
            - name: Record the box lane keys
              run: |
                  echo '${{ steps.boxes_bundler.outputs.cache-primary-key }}' > boxes-bundler-key.txt
                  echo '${{ steps.boxes_router.outputs.cache-primary-key }}' > boxes-router-key.txt
                  echo '${{ steps.boxes_music_player.outputs.cache-primary-key }}' > boxes-music-player-key.txt
                  echo '${{ steps.boxes_music_player_ssr.outputs.cache-primary-key }}' > boxes-music-player-ssr-key.txt

            - name: Probe the receipts lane
              id: receipts
              uses: actions/cache/restore@v4
              with:
                  lookup-only: true
                  path: receipts-completed.txt
                  key:
                      receipts-${{ hashFiles('ci-base-key.txt', 'boxes-bundler-key.txt',
                      'boxes-router-key.txt', 'boxes-music-player-key.txt',
                      'boxes-music-player-ssr-key.txt', 'packages/analyzer/**/*',
                      'packages/web/**/*', '!**/node_modules/**', '!**/dist/**', '!**/.witness/**')
                      }}

            - name: Report the lane decisions
              run: |
                  echo "unit=${{ steps.unit.outputs.cache-hit != 'true' }}"
                  echo "browser=${{ steps.browser.outputs.cache-hit != 'true' }}"
                  echo "completion-matrix=${{ steps.completion_matrix.outputs.cache-hit != 'true' }}"
                  echo "boxes-bundler=${{ steps.boxes_bundler.outputs.cache-hit != 'true' }}"
                  echo "boxes-router=${{ steps.boxes_router.outputs.cache-hit != 'true' }}"
                  echo "boxes-music-player=${{ steps.boxes_music_player.outputs.cache-hit != 'true' }}"
                  echo "boxes-music-player-ssr=${{ steps.boxes_music_player_ssr.outputs.cache-hit != 'true' }}"
                  echo "receipts=${{ steps.receipts.outputs.cache-hit != 'true' }}"

    # One Chromium download for the whole run: the browser and box lanes restore
    # this cache instead of each fetching its own copy, which is what used to
    # hang a runner for 28 minutes. Keyed by the lockfile, so the pinned
    # Playwright version is part of the key.
    prepare-playwright:
        needs: lanes
        if: needs.lanes.outputs.run_playwright == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Markless dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

            - name: Install the pinned Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install --with-deps chromium

            - name: Save the Playwright browser cache
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

    # The steps that used to run back-to-back inside one 30-minute `test` job
    # now run as the parallel lanes below. Nothing was dropped: every step of
    # the old job appears in exactly one lane, and the `test` job at the end of
    # this file fails unless every lane succeeded, so the required status check
    # keeps its name and its meaning.

    # Node vitest project, split by test file across three runners (~200 files).
    unit:
        needs: [typecheck, lanes]
        if: needs.lanes.outputs.run_unit == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                shard: ['1/3', '2/3', '3/3']
        env:
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit and integration tests
              run: pnpm exec vp test --project node --shard=${{ matrix.shard }}

    # Real-Chromium vitest project, split by test file across two runners.
    browser:
        needs: [typecheck, lanes, prepare-playwright]
        if: needs.lanes.outputs.run_browser == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                shard: ['1/2', '2/2']
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            # prepare-playwright already downloaded Chromium into this key. The
            # system libraries it needs are per-runner, so install-deps still
            # runs here; the browser itself only downloads if the cache missed.
            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium

            - name: Install Playwright browsers for the vitest browser project
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium

            - name: Run browser tests
              run: pnpm exec vp test --project browser --shard=${{ matrix.shard }}

            - name: Run the @markless/ui browser project
              if: matrix.shard == '1/2'
              run: pnpm exec vp test --project ui

    # Packaged editor completion matrix: builds the CJS plugin bundles, so it
    # owns a runner instead of serializing behind the test suites.
    completion-matrix:
        needs: [typecheck, lanes]
        if: needs.lanes.outputs.run_completion_matrix == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Run packaged editor completion matrix
              run: pnpm --dir packages/typescript-plugin test:completion-matrix

            # Green marker under this lane's content hash: an identical tree
            # skips the lane next time. A failed run never reaches this step.
            - name: Mark the completion-matrix lane complete
              run: echo ok > completion-matrix-completed.txt

            - name: Save the completion-matrix lane marker
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_completion_matrix }}
                  path: completion-matrix-completed.txt

    # Bundler pipeline boxes. Boxes drive a real browser through @async/witness,
    # so every box lane installs the cached Chromium too. The receipts this lane
    # writes are the only copy of that evidence, so they leave as an artifact for
    # the `receipts` job to validate.
    boxes-bundler:
        needs: [typecheck, lanes, prepare-playwright]
        if: needs.lanes.outputs.run_boxes_bundler == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium

            - name: Install Playwright browsers for the pipeline boxes
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium

            - name: Run bundler pipeline boxes
              run: pnpm --dir packages/bundler test:boxes

            - name: Upload bundler analyzer receipts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: receipts-bundler
                  path: packages/bundler/.witness/receipts/*.json
                  include-hidden-files: true
                  if-no-files-found: error

            # The marker and the receipts share one cache entry under this
            # lane's key, so a later run that skips the lane can still restore
            # the receipt set this lane is the only producer of.
            - name: Mark the bundler box lane complete
              run: echo ok > boxes-bundler-completed.txt

            - name: Save the bundler box lane marker and receipts
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_bundler }}
                  path: |
                      boxes-bundler-completed.txt
                      packages/bundler/.witness/receipts

    # Router pipeline boxes.
    boxes-router:
        needs: [typecheck, lanes, prepare-playwright]
        if: needs.lanes.outputs.run_boxes_router == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium

            - name: Install Playwright browsers for the pipeline boxes
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium

            - name: Run router pipeline boxes
              run: pnpm --dir packages/router test:boxes

            - name: Upload router analyzer receipts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: receipts-router
                  path: packages/router/.witness/receipts/*.json
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Mark the router box lane complete
              run: echo ok > boxes-router-completed.txt

            - name: Save the router box lane marker and receipts
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_router }}
                  path: |
                      boxes-router-completed.txt
                      packages/router/.witness/receipts

    # music-player demo: analyzer gate tests then boxes, same order as before.
    boxes-music-player:
        needs: [typecheck, lanes, prepare-playwright]
        if: needs.lanes.outputs.run_boxes_music_player == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium

            - name: Install Playwright browsers for the pipeline boxes
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium

            - name: Run music-player demo analyzer gate tests
              run: pnpm --dir demos/music-player test:analyzer

            - name: Run music-player demo boxes
              run: pnpm --dir demos/music-player test:boxes

            - name: Upload music-player analyzer receipts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: receipts-music-player
                  path: demos/music-player/.witness/receipts/*.json
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Mark the music-player box lane complete
              run: echo ok > boxes-music-player-completed.txt

            - name: Save the music-player box lane marker and receipts
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_music_player }}
                  path: |
                      boxes-music-player-completed.txt
                      demos/music-player/.witness/receipts

    # music-player-ssr demo: analyzer gate tests then boxes.
    boxes-music-player-ssr:
        needs: [typecheck, lanes, prepare-playwright]
        if: needs.lanes.outputs.run_boxes_music_player_ssr == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium

            - name: Install Playwright browsers for the pipeline boxes
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium

            - name: Run music-player-ssr demo analyzer gate tests
              run: pnpm --dir demos/music-player-ssr test:analyzer

            - name: Run music-player-ssr demo boxes
              run: pnpm --dir demos/music-player-ssr test:boxes

            - name: Upload music-player-ssr analyzer receipts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: receipts-music-player-ssr
                  path: demos/music-player-ssr/.witness/receipts/*.json
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Mark the music-player-ssr box lane complete
              run: echo ok > boxes-music-player-ssr-completed.txt

            - name: Save the music-player-ssr box lane marker and receipts
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_music_player_ssr }}
                  path: |
                      boxes-music-player-ssr-completed.txt
                      demos/music-player-ssr/.witness/receipts

    # Reassembles the receipt tree the split box lanes wrote on four different
    # runners, adds the @markless/web receipt that receipts:generate writes
    # here, and runs the same receipts:check that used to run at the end of the
    # serial job. Every receipt records `git rev-parse HEAD` and a source-file
    # hash, and all lanes check out the same run SHA, so receipts written
    # elsewhere still match here.
    # A skipped box lane still has to contribute its receipts, so every box lane
    # saves them into the cache entry under its own key. This job downloads the
    # artifact from a lane that ran and restores that cache for a lane that was
    # skipped, which is only possible because a skip means the key already hit.
    # `always()` is required: a skipped dependency would otherwise skip this job.
    receipts:
        needs: [lanes, boxes-bundler, boxes-router, boxes-music-player, boxes-music-player-ssr]
        if: always() && needs.lanes.outputs.run_receipts == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            # `always()` above also lets this job start after a failed box lane,
            # so refuse to validate a receipt set built on a red lane.
            - name: Verify prerequisites
              if: |
                  !(
                    needs.lanes.result == 'success' &&
                    (needs['boxes-bundler'].result == 'success' || needs['boxes-bundler'].result == 'skipped') &&
                    (needs['boxes-router'].result == 'success' || needs['boxes-router'].result == 'skipped') &&
                    (needs['boxes-music-player'].result == 'success' || needs['boxes-music-player'].result == 'skipped') &&
                    (needs['boxes-music-player-ssr'].result == 'success' || needs['boxes-music-player-ssr'].result == 'skipped')
                  )
              run: exit 1

            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            # One download per artifact with an explicit destination: a merged
            # download would flatten each artifact to its own root and lose the
            # package prefix the manifest checks. A lane that skipped uploaded
            # nothing this run, so its receipts come back out of the cache entry
            # its last green run saved under the same key.
            - name: Download bundler analyzer receipts
              if: needs.lanes.outputs.run_boxes_bundler == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: receipts-bundler
                  path: packages/bundler/.witness/receipts

            - name: Restore cached bundler analyzer receipts
              if: needs.lanes.outputs.run_boxes_bundler != 'true'
              uses: actions/cache/restore@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_bundler }}
                  fail-on-cache-miss: true
                  path: |
                      boxes-bundler-completed.txt
                      packages/bundler/.witness/receipts

            - name: Download router analyzer receipts
              if: needs.lanes.outputs.run_boxes_router == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: receipts-router
                  path: packages/router/.witness/receipts

            - name: Restore cached router analyzer receipts
              if: needs.lanes.outputs.run_boxes_router != 'true'
              uses: actions/cache/restore@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_router }}
                  fail-on-cache-miss: true
                  path: |
                      boxes-router-completed.txt
                      packages/router/.witness/receipts

            - name: Download music-player analyzer receipts
              if: needs.lanes.outputs.run_boxes_music_player == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: receipts-music-player
                  path: demos/music-player/.witness/receipts

            - name: Restore cached music-player analyzer receipts
              if: needs.lanes.outputs.run_boxes_music_player != 'true'
              uses: actions/cache/restore@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_music_player }}
                  fail-on-cache-miss: true
                  path: |
                      boxes-music-player-completed.txt
                      demos/music-player/.witness/receipts

            - name: Download music-player-ssr analyzer receipts
              if: needs.lanes.outputs.run_boxes_music_player_ssr == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: receipts-music-player-ssr
                  path: demos/music-player-ssr/.witness/receipts

            - name: Restore cached music-player-ssr analyzer receipts
              if: needs.lanes.outputs.run_boxes_music_player_ssr != 'true'
              uses: actions/cache/restore@v4
              with:
                  key: ${{ needs.lanes.outputs.key_boxes_music_player_ssr }}
                  fail-on-cache-miss: true
                  path: |
                      boxes-music-player-ssr-completed.txt
                      demos/music-player-ssr/.witness/receipts

            - name: Generate analyzer unit-contract receipts
              run: pnpm receipts:generate

            - name: Validate required analyzer consumer receipts
              run: pnpm receipts:check

            - name: Upload analyzer contract receipts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: analyzer-contract-receipts
                  path: |
                      packages/*/.witness/receipts/*.json
                      demos/*/.witness/receipts/*.json
                  # .witness is a dot-directory; upload-artifact v4.4+ skips
                  # hidden paths unless told otherwise (receipts:check reads
                  # the same files and passes, so silence here means missed
                  # evidence, not missing receipts).
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Mark the receipts lane complete
              run: echo ok > receipts-completed.txt

            - name: Save the receipts lane marker
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_receipts }}
                  path: receipts-completed.txt

    # Saves the green markers for the sharded lanes. A shard cannot save its own
    # marker: one green shard next to a red one would let the whole lane skip on
    # the next identical tree. This job only saves once the lane as a whole won.
    save-lane-markers:
        needs: [lanes, unit, browser]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Mark the unit lane complete
              if: needs.lanes.outputs.run_unit == 'true' && needs.unit.result == 'success'
              run: echo ok > unit-completed.txt

            - name: Save the unit lane marker
              if: needs.lanes.outputs.run_unit == 'true' && needs.unit.result == 'success'
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_unit }}
                  path: unit-completed.txt

            - name: Mark the browser lane complete
              if: needs.lanes.outputs.run_browser == 'true' && needs.browser.result == 'success'
              run: echo ok > browser-completed.txt

            - name: Save the browser lane marker
              if: needs.lanes.outputs.run_browser == 'true' && needs.browser.result == 'success'
              uses: actions/cache/save@v4
              with:
                  key: ${{ needs.lanes.outputs.key_browser }}
                  path: browser-completed.txt

    # The required status check. It holds the name branch protection already
    # points at, and it is red unless every lane above went green or hit its
    # content hash, so neither splitting the work nor caching it weakened the
    # gate.
    test:
        needs:
            [
                typecheck,
                lanes,
                prepare-playwright,
                unit,
                browser,
                completion-matrix,
                boxes-bundler,
                boxes-router,
                boxes-music-player,
                boxes-music-player-ssr,
                receipts,
            ]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # `skipped` means the lane's content hash already had a green marker.
            # It cannot mean "an upstream job failed": typecheck, lanes and
            # prepare-playwright are the only jobs that can skip a lane, and all
            # three are in `needs`, so their failure lands here as `failure`.
            - name: Fail unless every test lane succeeded or hit its content hash
              run: |
                  results="${{ join(needs.*.result, ',') }}"
                  echo "lane results: $results"
                  failed=0
                  for result in $(printf '%s' "$results" | tr ',' ' '); do
                      if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                          failed=1
                      fi
                  done
                  if [ "$failed" = "1" ]; then
                      echo "::error::A test lane did not succeed: $results"
                      exit 1
                  fi

    # Separate from `test` on purpose. The CLI workspace matrix needs npm, pnpm,
    # yarn (via corepack), bun and deno all on PATH and runs real installs, so it
    # gets its own toolchain and its own 20 minutes instead of slowing the main
    # suite. It is blocking, because the whole point of the workspace-detection
    # work is the behavior only a real install can show.
    package-manager-matrix:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Turns the matrix file on. Without it every lane is skipped.
            MARKLESS_PM_MATRIX: '1'
            # corepack provisions yarn classic and yarn berry; the prompt would
            # hang a non-interactive runner.
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2

            - uses: denoland/setup-deno@v2

            - name: Enable corepack for the yarn lanes
              run: corepack enable

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Run the package-manager workspace matrix
              run: pnpm exec vitest run packages/cli/test/workspace-matrix.test.ts --project=node

    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            bench: ${{ steps.filter.outputs.bench }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Decide whether benchmarks can be affected
              id: filter
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                    base="${{ github.event.pull_request.base.sha }}"
                  else
                    base="${{ github.event.before }}"
                  fi
                  bench=true
                  if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                    changed=$(git diff --name-only "$base" HEAD)
                    # Skip benchmarking only when every changed file is docs/spec-only.
                    if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(specs/|docs/|\.claude/|\.codex/|LICENSE$|.*\.md$)'; then
                      bench=false
                    fi
                  fi
                  echo "bench=$bench" >> "$GITHUB_OUTPUT"
                  echo "benchmarks needed: $bench"

    benchmark:
        needs: changes
        if: needs.changes.outputs.bench == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: select
                      benchmarks: 04_
                    - shard: create
                      benchmarks: 01_ 07_ 40_
                    - shard: update
                      benchmarks: 02_ 03_ 05_
                    - shard: list
                      benchmarks: 06_ 08_ 09_
        env:
            MARKLESS_CI_TEMP: /tmp/markless-ci-${{ github.run_id }}
            MARKLESS_REPO_ROOT: ${{ github.workspace }}
            MARKLESS_BASE_REPO_ROOT: /tmp/markless-ci-${{ github.run_id }}/markless-baseline
            JSFB_ROOT: /tmp/markless-ci-${{ github.run_id }}/js-framework-benchmark
            MARKLESS_JSFB_BASELINE_RESULTS: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/results-markless-base
            MARKLESS_JSFB_RESULTS: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/results-markless-ci
            MARKLESS_JSFB_BASELINE_TRACES: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/traces-markless-base
            MARKLESS_JSFB_TRACES: /tmp/markless-ci-${{ github.run_id }}/markless-jsfb/traces-markless-ci
            JSFB_SERVER_LOG: /tmp/markless-ci-${{ github.run_id }}/jsfb-server.log
            MARKLESS_JSFB_CI_COUNT: '5'
            MARKLESS_JSFB_BENCHMARKS: ${{ matrix.benchmarks }}
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            NPM_CONFIG_PREFER_OFFLINE: 'true'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare CI temp directory
              run: mkdir -p "$MARKLESS_CI_TEMP"

            - name: Resolve benchmark baseline revision
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                    echo "MARKLESS_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
                  else
                    echo "MARKLESS_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
                  fi

            - name: Checkout benchmark baseline revision
              run: git worktree add "$MARKLESS_BASE_REPO_ROOT" "$MARKLESS_BASE_SHA"

            - name: Install baseline Markless dependencies
              working-directory: ${{ env.MARKLESS_BASE_REPO_ROOT }}
              run: pnpm install --frozen-lockfile

            - name: Checkout JS Framework Benchmark
              run: git clone --depth 1 https://github.com/krausest/js-framework-benchmark.git "$JSFB_ROOT"

            - name: Cache JS Framework Benchmark npm downloads
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: jsfb-npm-${{ runner.os }}-node24-v1
                  restore-keys: |
                      jsfb-npm-${{ runner.os }}-node24-

            # --legacy-peer-deps applies to the upstream root install only. The
            # js-framework-benchmark root package.json pins eslint ^10.7.0 next to
            # eslint-plugin-react ^7.37.5, whose peer range stops at eslint ^9.7, so
            # npm ci fails ERESOLVE on a tree we do not own and cannot pin from here.
            # The conflict is confined to their lint tooling, which no benchmark step
            # runs. The webdriver-ts and server installs below have no eslint
            # dependency, so they stay strict.
            - name: Install JS Framework Benchmark dependencies
              working-directory: ${{ env.JSFB_ROOT }}
              run: |
                  npm ci --legacy-peer-deps --ignore-scripts --prefer-offline --no-audit --fund=false
                  npm run install-webdriver-ts
                  npm run install-server

            - name: Install Markless benchmark fixture
              run: pnpm bench:jsfb:prepare -- --jsfb-root "$JSFB_ROOT"

            - name: Start JS Framework Benchmark server
              working-directory: ${{ env.JSFB_ROOT }}
              run: |
                  npm start > "$JSFB_SERVER_LOG" 2>&1 &
                  for attempt in {1..60}; do
                    if curl -fsS http://localhost:8080/ls > /dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done
                  cat "$JSFB_SERVER_LOG"
                  exit 1

            # Baseline and current run back-to-back per benchmark so both sides
            # of each guard ratio see the same runner speed; separated passes
            # drift several percent on hosted runners and flake the guard.
            - name: Run interleaved baseline/current benchmark pairs
              working-directory: ${{ env.JSFB_ROOT }}
              run: |
                  set -o pipefail
                  mkdir -p "$MARKLESS_CI_TEMP/markless-jsfb" \
                    "$MARKLESS_JSFB_BASELINE_RESULTS" "$MARKLESS_JSFB_RESULTS" \
                    "$MARKLESS_JSFB_BASELINE_TRACES" "$MARKLESS_JSFB_TRACES"

                  run_side() {
                    side="$1"; bench="$2"; repo_root="$3"; results_dir="$4"; traces_dir="$5"
                    rm -rf webdriver-ts/results webdriver-ts/traces
                    MARKLESS_REPO_ROOT="$repo_root" node --input-type=module -e "import { rebuildFrameworks } from './cli/rebuild-build-single.js'; if (!rebuildFrameworks(['keyed/markless'], true)) process.exit(1);"
                    CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || echo /usr/bin/google-chrome)"
                    MARKLESS_REPO_ROOT="$repo_root" npm run bench -- \
                      --headless \
                      --chromeBinary "$CHROME_BIN" \
                      --framework keyed/markless \
                      --count "$MARKLESS_JSFB_CI_COUNT" \
                      --benchmark "$bench" \
                      2>&1 | tee "$RUNNER_TEMP/jsfb-bench-$side-$bench.log"
                    if grep -Fq "Frameworks that will be benchmarked []" "$RUNNER_TEMP/jsfb-bench-$side-$bench.log"; then
                      exit 1
                    fi
                    if ! compgen -G "webdriver-ts/results/*markless*-keyed_*.json" > /dev/null; then
                      exit 1
                    fi
                    mv webdriver-ts/results/* "$results_dir"/
                    if compgen -G "webdriver-ts/traces/*" > /dev/null; then
                      mv webdriver-ts/traces/* "$traces_dir"/
                    fi
                  }

                  for bench in $MARKLESS_JSFB_BENCHMARKS; do
                    run_side baseline "$bench" "$MARKLESS_BASE_REPO_ROOT" "$MARKLESS_JSFB_BASELINE_RESULTS" "$MARKLESS_JSFB_BASELINE_TRACES"
                    run_side current "$bench" "$MARKLESS_REPO_ROOT" "$MARKLESS_JSFB_RESULTS" "$MARKLESS_JSFB_TRACES"
                  done

            - name: Upload JSFB shard results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: markless-jsfb-results-${{ matrix.shard }}
                  path: |
                      ${{ env.MARKLESS_JSFB_BASELINE_RESULTS }}
                      ${{ env.MARKLESS_JSFB_RESULTS }}
                      ${{ env.MARKLESS_JSFB_BASELINE_TRACES }}
                      ${{ env.MARKLESS_JSFB_TRACES }}
                      ${{ env.JSFB_SERVER_LOG }}

    benchmark-guard:
        needs: [changes, benchmark]
        if: needs.changes.outputs.bench == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            MARKLESS_JSFB_BASELINE_RESULTS: ${{ github.workspace }}/.jsfb-merged/markless-jsfb/results-markless-base
            MARKLESS_JSFB_RESULTS: ${{ github.workspace }}/.jsfb-merged/markless-jsfb/results-markless-ci
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Download JSFB shard results
              uses: actions/download-artifact@v4
              with:
                  pattern: markless-jsfb-results-*
                  merge-multiple: true
                  path: .jsfb-merged

            - name: Compare benchmark results against baseline
              run: node scripts/benchmarks/jsfb-baseline.mjs compare
