name: CI
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    agent-files:
        runs-on: ubuntu-latest
        steps:
            - run: echo "probe ${{ github.event_name }}"; sleep 15
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - run: echo "probe ${{ github.event_name }}"; sleep 15
    test:
        runs-on: ubuntu-latest
        steps:
            - run: echo "probe ${{ github.event_name }}"; sleep 15
