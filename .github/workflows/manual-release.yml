name: Manual Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version bump type'
                required: true
                default: 'minor'
                type: choice
                options:
                    - patch
                    - minor
                    - major
            preid:
                description: 'Prerelease ID (e.g., alpha, beta) - leave empty for stable release'
                required: false
                type: string

permissions:
    contents: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: 🚀 Release
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/

            - name: ✨ Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🔍 Get current version and previous tag
              id: current_version
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  echo "Current version: $CURRENT_VERSION"

                  # Get the previous tag BEFORE bumping (for changelog generation)
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                  if [ -z "$PREVIOUS_TAG" ]; then
                    echo "No previous tag found, will use first commit for changelog"
                    PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
                  fi
                  echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
                  echo "Previous tag: $PREVIOUS_TAG"

            - name: 🔧 Configure git identity
              run: |
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git config --global user.name "github-actions[bot]"

            - name: 📈 Bump versions
              id: bump
              run: |
                  # Build the bump command with explicit release type and yes flag for non-interactive CI
                  # Use --release to specify version type and --yes to skip all prompts
                  BUMP_CMD="pnpm bumpp package.json packages/*/package.json --release ${{ github.event.inputs.version }} --yes"

                  # Add preid if provided
                  if [ -n "${{ github.event.inputs.preid }}" ]; then
                    BUMP_CMD="$BUMP_CMD --preid ${{ github.event.inputs.preid }}"
                  fi

                  # Execute bump and capture the new version
                  $BUMP_CMD --commit "chore: release v%s" --tag "v%s" --all

                  # Get the new version
                  NEW_VERSION=$(node -p "require('./package.json').version")
                  echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
                  echo "New version: $NEW_VERSION"

            - name: 📝 Generate changelog for this release
              id: changelog
              run: |
                  CURRENT_TAG="v${{ steps.bump.outputs.NEW_VERSION }}"
                  PREVIOUS_TAG="${{ steps.current_version.outputs.PREVIOUS_TAG }}"

                  echo "Previous tag: $PREVIOUS_TAG"
                  echo "Current tag: $CURRENT_TAG"

                  # Generate changelog for just this release (from previous tag to before the release commit)
                  # HEAD~1 excludes the version bump commit itself from the changelog
                  pnpm changelogen --output RELEASE_CHANGELOG.md --no-commit --no-tag --from $PREVIOUS_TAG --to HEAD~1

                  # Extract the release notes - changelogen outputs full changelog, we want just the first version section
                  # The awk script finds the first "## " header and extracts everything after it until the next "## "
                  awk '
                    BEGIN { found=0 }
                    /^## / {
                      if (found) exit
                      found=1
                      next
                    }
                    found {print}
                  ' RELEASE_CHANGELOG.md > release-notes.md

                  # If empty or only whitespace, use a default message
                  if [ ! -s release-notes.md ] || [ "$(tr -d '[:space:]' < release-notes.md)" = "" ]; then
                    echo "Release v${{ steps.bump.outputs.NEW_VERSION }}" > release-notes.md
                  fi

                  # Display the release notes
                  echo "Release notes:"
                  cat release-notes.md

                  # Clean up temp files to ensure clean working tree for publish
                  rm RELEASE_CHANGELOG.md

            - name: 📤 Push changes and tags
              run: |
                  git push
                  git push --tags

            - name: 🔍 Verify versions bumped correctly
              run: |
                  EXPECTED_VERSION="${{ steps.bump.outputs.NEW_VERSION }}"
                  echo "Expected version: $EXPECTED_VERSION"

                  # Check root package.json
                  ROOT_VERSION=$(node -p "require('./package.json').version")
                  if [ "$ROOT_VERSION" != "$EXPECTED_VERSION" ]; then
                    echo "ERROR: Root package.json version mismatch! Expected $EXPECTED_VERSION, got $ROOT_VERSION"
                    exit 1
                  fi

                  # Check all package.json files under packages/
                  for pkg in packages/*/package.json; do
                    PKG_VERSION=$(node -p "require('./$pkg').version")
                    PKG_NAME=$(node -p "require('./$pkg').name")
                    if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
                      echo "ERROR: $pkg ($PKG_NAME) version mismatch! Expected $EXPECTED_VERSION, got $PKG_VERSION"
                      exit 1
                    fi
                    echo "✓ $PKG_NAME: $PKG_VERSION"
                  done

                  echo "All versions correctly bumped to $EXPECTED_VERSION"

            - name: 🏗️ Build packages
              run: pnpm build

            - name: 🚀 Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.bump.outputs.NEW_VERSION }}
                  name: v${{ steps.bump.outputs.NEW_VERSION }}
                  body_path: release-notes.md
                  draft: false
                  prerelease: ${{ github.event.inputs.preid != '' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 🧹 Clean up release notes file
              run: rm release-notes.md

            - name: 📦 Publish to npm with provenance
              run: |
                  # Publish each package using npm (OIDC requires npm, not pnpm)
                  # Packages marked "private": true are skipped until they are ready to go public
                  for pkg in packages/*; do
                    [ -f "$pkg/package.json" ] || continue
                    IS_PRIVATE=$(node -p "require('./$pkg/package.json').private === true")
                    if [ "$IS_PRIVATE" = "true" ]; then
                      echo "Skipping $pkg (private)"
                      continue
                    fi
                    echo "Publishing $pkg..."
                    (cd $pkg && npm publish --access public) || echo "Skipped $pkg (may already exist)"
                  done
