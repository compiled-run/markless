# One-click release: cut the next MINOR version from a green main, publish it, and announce it.
# How to run it and what it needs once: docs/ci-process.md, "Cutting a release".
#
# Publishing still happens only in release.yml (npm trusted publishing names that file), which
# this workflow dispatches at the new tag and waits for. This file never holds id-token: write.
name: Release cut

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Rehearse: bump, changelog, commit (with its hooks) and pack checks, but no tag, push, publish or GitHub Release.'
                required: false
                type: boolean
                default: false

# Not the `release` group: this run waits on a release.yml run, which would queue behind it forever.
concurrency:
    group: release-cut
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    cut:
        if: github.repository == 'compiled-run/markless'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            # Push the release commit and tag, and create the GitHub Release.
            contents: write
            # Read main's CI runs, dispatch release.yml and watch it.
            actions: write
        env:
            GH_TOKEN: ${{ github.token }}
            DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
            GIT_AUTHOR_NAME: github-actions[bot]
            GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            GIT_COMMITTER_NAME: github-actions[bot]
            GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

        steps:
            - name: Refuse anything but main
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Releases are cut from main only; this run was dispatched on ${GITHUB_REF}."
                  exit 1

            - name: Refuse a real cut that cannot push to protected main
              if: ${{ !inputs.dry_run }}
              env:
                  HAS_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
              run: |
                  set -euo pipefail
                  protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')"
                  if [ "$protected" = "true" ] && [ "$HAS_PUSH_TOKEN" != "true" ]; then
                    echo "::error::main is protected and the RELEASE_PUSH_TOKEN secret is not set, so the release commit could not be pushed. See docs/ci-process.md, 'Cutting a release'."
                    exit 1
                  fi

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # The release commit is pushed with these credentials.
                  token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            # The release commit runs the pre-commit hook, which runs CI's fast jobs; their unit
            # tests launch Chromium and WebKit.
            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}
                  path: .cache/ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium webkit

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium webkit

            - name: Cut the next minor version
              id: cut
              run: |
                  set -euo pipefail
                  if [ "$DRY_RUN" = "true" ]; then
                    node scripts/release/cut.mjs --dry-run
                  else
                    node scripts/release/cut.mjs
                  fi

            - name: Show the drafted changelog section
              if: always() && steps.cut.outputs.notes_file != ''
              env:
                  NOTES_FILE: ${{ steps.cut.outputs.notes_file }}
                  TAG: ${{ steps.cut.outputs.tag }}
              run: |
                  {
                    if [ "$DRY_RUN" = "true" ]; then echo "## ${TAG} (dry run)"; else echo "## ${TAG}"; fi
                    echo
                    cat "$NOTES_FILE"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Push the release commit and tag
              if: ${{ !inputs.dry_run && steps.cut.outputs.resumed != 'true' }}
              env:
                  TAG: ${{ steps.cut.outputs.tag }}
              run: git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"

            - name: Publish through release.yml at the tag
              if: ${{ !inputs.dry_run }}
              env:
                  VERSION: ${{ steps.cut.outputs.version }}
                  TAG: ${{ steps.cut.outputs.tag }}
                  SHA: ${{ steps.cut.outputs.sha }}
              run: |
                  set -euo pipefail
                  since="$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)"
                  gh workflow run release.yml --ref "$TAG" \
                    -f version="$VERSION" -f mode=publish -f confirm="publish markless ${VERSION}"
                  run_id=''
                  for _ in $(seq 1 24); do
                    run_id="$(gh run list --workflow release.yml --event workflow_dispatch --limit 20 \
                      --json databaseId,headSha,createdAt \
                      --jq "[.[] | select(.headSha == \"${SHA}\" and .createdAt >= \"${since}\")] | first | .databaseId // empty")"
                    [ -n "$run_id" ] && break
                    sleep 5
                  done
                  if [ -z "$run_id" ]; then
                    echo "::error::release.yml was dispatched at ${TAG} but its run did not appear within 2 minutes."
                    exit 1
                  fi
                  echo "Watching release.yml run ${run_id}"
                  gh run watch "$run_id" --exit-status --interval 15

            - name: Create the GitHub Release
              if: ${{ !inputs.dry_run }}
              env:
                  TAG: ${{ steps.cut.outputs.tag }}
                  NOTES_FILE: ${{ steps.cut.outputs.notes_file }}
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "GitHub Release ${TAG} already exists."
                  else
                    gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --latest --verify-tag
                  fi
