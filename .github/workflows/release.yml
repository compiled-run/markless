# npm trusted publishing for the @markless packages, and the one-click release cut.
#
# THE FILENAME IS LOAD-BEARING. DO NOT RENAME THIS FILE.
# Every package's trusted-publisher entry on npmjs.com names `release.yml`
# literally. Renaming this file silently breaks publishing for all of them, with
# an authentication error that says nothing about a rename. npm checks the
# workflow that was dispatched, not one it calls, which is why the cut lives in
# this file instead of a separate workflow that calls this one.
#
# How publishing is authenticated: it is not. There is no stored npm token
# anywhere in this repository. GitHub mints a short-lived OIDC identity token
# for the `release` job (that is what `id-token: write` buys), the npm CLI trades
# it with the registry, and the registry checks that the claim matches the
# trusted publisher configured for each package. Two consequences worth knowing:
#
#   - Publish authority is now "whoever can land a change to this file and
#     dispatch it", not "whoever holds the owner's npm 2FA device".
#   - A stored NPM_TOKEN would defeat the entire point, so the `release` job
#     asserts one is NOT present rather than trusting that nobody added one.
#
# Modes:
#   cut          One click (`gh workflow run release.yml -f mode=cut` on main):
#                the `cut` job bumps to the next minor, writes the CHANGELOG
#                section, commits and tags vX.Y.0, runs CI on that commit as a pull
#                request, and moves main to it and pushes the tag once main's required checks pass;
#                the `release` job publishes that tag; the `announce` job creates
#                the GitHub Release. See docs/ci-process.md, "Cutting a release".
#   cut-dry-run  The cut's bump, changelog, hooked commit and pack checks, with no
#                tag, push, publish or GitHub Release.
#   dry-run / publish  Publish `version` exactly as committed at the dispatched
#                ref; the `release` job never bumps or writes to git. publish
#                needs the typed confirmation and runs only at the v<version> tag.
name: Release

on:
    workflow_dispatch:
        inputs:
            mode:
                description: 'cut releases the next minor version end to end. cut-dry-run rehearses it. dry-run and publish publish an already committed version.'
                required: true
                type: choice
                default: dry-run
                options:
                    - dry-run
                    - publish
                    - cut
                    - cut-dry-run
            version:
                description: 'dry-run and publish only. Must ALREADY equal the root version and every release package version at this ref.'
                required: false
                type: string
                default: ''
            confirm:
                description: 'publish mode only. Type exactly: publish markless <version>'
                required: false
                type: string
                default: ''
            dist_tag:
                description: 'Optional npm dist-tag. Empty means the registry default (latest).'
                required: false
                type: string
                default: ''

# One release at a time, and never cancel one in flight: publishing is
# irreversible, so a cancelled run can leave a partial release behind.
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # Never holds id-token: it can push to main, but it cannot publish.
    cut:
        if: github.repository == 'compiled-run/markless' && startsWith(inputs.mode, 'cut')
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            # Push the release branch and the tag.
            contents: write
            # Open the release pull request into main.
            pull-requests: write
            # Approve and watch the release pull request's CI run.
            actions: write
            # Read the release commit's check runs.
            checks: read
        outputs:
            version: ${{ steps.cut.outputs.version }}
            tag: ${{ steps.cut.outputs.tag }}
            sha: ${{ steps.cut.outputs.sha }}
        env:
            GH_TOKEN: ${{ github.token }}
            # Outside the checkout: the release commit's pre-commit hook lints the whole tree.
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}-ms-playwright
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            PUPPETEER_SKIP_DOWNLOAD: '1'
            CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
            GIT_AUTHOR_NAME: github-actions[bot]
            GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            GIT_COMMITTER_NAME: github-actions[bot]
            GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

        steps:
            - name: Refuse anything but main
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Releases are cut from main only; this run was dispatched on ${GITHUB_REF}."
                  exit 1

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Check that ci.yml reports every check main's protection requires
              run: node scripts/release/required-checks.mjs --names

            # The release commit runs the pre-commit hook, which runs CI's fast jobs; their unit
            # tests launch Chromium and WebKit.
            - name: Restore the Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-ms-playwright

            - name: Install Playwright system dependencies
              run: pnpm --dir packages/vitest-browser exec playwright install-deps chromium webkit

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm --dir packages/vitest-browser exec playwright install chromium webkit

            - name: Cut the next minor version
              id: cut
              env:
                  MODE: ${{ inputs.mode }}
              run: |
                  set -euo pipefail
                  if [ "$MODE" = "cut-dry-run" ]; then
                    node scripts/release/cut.mjs --dry-run
                  else
                    node scripts/release/cut.mjs
                  fi

            - name: Show the drafted changelog section
              env:
                  NOTES_FILE: ${{ steps.cut.outputs.notes_file }}
              run: |
                  cp "$NOTES_FILE" "$RUNNER_TEMP/release-notes.md"
                  cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

            - name: Keep the changelog section for the GitHub Release
              uses: actions/upload-artifact@v4
              with:
                  name: release-notes
                  path: ${{ runner.temp }}/release-notes.md
                  if-no-files-found: error

            # main's ruleset counts required checks only from a pull_request CI run on the commit:
            # the same checks green from a workflow_dispatch run were refused for a push and a merge.
            - name: Push the release commit to its release branch
              if: inputs.mode == 'cut' && steps.cut.outputs.resumed != 'true'
              env:
                  TAG: ${{ steps.cut.outputs.tag }}
              run: git push origin "HEAD:refs/heads/release/${TAG}"

            # The sites migrated to Markless, built on the release commit and compared with main's last nightly
            # results (ecosystem-ci.yml). It runs while CI does; a regression stops the cut before main moves.
            - name: Start ecosystem CI on the release commit
              id: ecosystem
              if: inputs.mode == 'cut' && steps.cut.outputs.resumed != 'true'
              env:
                  SHA: ${{ steps.cut.outputs.sha }}
              run: |
                  set -euo pipefail
                  gh workflow run ecosystem-ci.yml --ref main -f ref="$SHA" -f gate=release
                  title="Ecosystem CI on ${SHA} (release gate)"
                  run_id=''
                  for _ in $(seq 1 24); do
                    run_id="$(gh run list --workflow ecosystem-ci.yml --event workflow_dispatch --limit 20 \
                      --json databaseId,displayTitle --jq "[.[] | select(.displayTitle == \"${title}\")][0].databaseId // empty")"
                    [ -n "$run_id" ] && break
                    sleep 5
                  done
                  if [ -z "$run_id" ]; then
                    echo "::error::No '${title}' run appeared within 2 minutes of dispatching ecosystem-ci.yml."
                    exit 1
                  fi
                  echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
                  echo "Ecosystem CI run ${run_id} checks ${SHA}"

            # A pull request opened with this token gets a pull_request run that waits for approval
            # (action_required); approve exactly that run, for this commit and branch, then watch it.
            - name: Run CI on the release pull request
              if: inputs.mode == 'cut' && steps.cut.outputs.resumed != 'true'
              env:
                  TAG: ${{ steps.cut.outputs.tag }}
                  SHA: ${{ steps.cut.outputs.sha }}
              run: |
                  set -euo pipefail
                  pr="$(gh pr create --base main --head "release/${TAG}" --title "chore(release): ${TAG}" \
                    --body "The release cut's commit for ${TAG}. The cut moves main to ${SHA} once this pull request's CI passes main's required checks.")"
                  echo "Opened ${pr}"
                  run_id=''
                  for _ in $(seq 1 24); do
                    run_id="$(gh run list --workflow ci.yml --event pull_request --commit "$SHA" \
                      --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
                    [ -n "$run_id" ] && break
                    sleep 5
                  done
                  if [ -z "$run_id" ]; then
                    echo "::error::${pr} got no pull_request CI run on ${SHA} within 2 minutes."
                    exit 1
                  fi
                  run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                    --jq '[.event, .head_sha, .head_branch] | join(" ")')"
                  if [ "$run" != "pull_request ${SHA} release/${TAG}" ]; then
                    echo "::error::CI run ${run_id} is '${run}', not the release pull request's CI on ${SHA}."
                    exit 1
                  fi
                  if [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')" = action_required ]; then
                    gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null
                    echo "Approved CI run ${run_id}: it waited for approval because this workflow's token opened ${pr}"
                  fi
                  echo "Watching CI run ${run_id} on ${SHA}"
                  gh run watch "$run_id" --exit-status --interval 30

            - name: Require ecosystem CI to find no regression on the release commit
              if: inputs.mode == 'cut' && steps.cut.outputs.resumed != 'true'
              env:
                  RUN_ID: ${{ steps.ecosystem.outputs.run_id }}
              run: gh run watch "$RUN_ID" --exit-status --interval 30

            - name: Require every check main's protection names on the release commit
              if: inputs.mode == 'cut' && steps.cut.outputs.resumed != 'true'
              env:
                  SHA: ${{ steps.cut.outputs.sha }}
              run: node scripts/release/required-checks.mjs --sha "$SHA"

            # A fast-forward to exactly the commit CI checked, which marks the pull request merged;
            # the pull request's green CI run on that commit is what the next cut finds for main.
            - name: Move main to the release commit
              if: inputs.mode == 'cut' && steps.cut.outputs.resumed != 'true'
              env:
                  SHA: ${{ steps.cut.outputs.sha }}
              run: |
                  set -euo pipefail
                  base="$(git rev-parse "${SHA}^")"
                  main="$(git ls-remote origin refs/heads/main | cut -f1)"
                  if [ "$main" != "$base" ]; then
                    echo "::error::main moved from ${base} to ${main} during the cut; nothing was released, run the cut again."
                    exit 1
                  fi
                  git push origin "${SHA}:refs/heads/main"

            - name: Push the tag
              if: inputs.mode == 'cut' && steps.cut.outputs.push_tag == 'true'
              env:
                  TAG: ${{ steps.cut.outputs.tag }}
              run: git push origin "refs/tags/${TAG}"

            - name: Delete the release branch
              if: always() && inputs.mode == 'cut' && steps.cut.outputs.tag != ''
              env:
                  TAG: ${{ steps.cut.outputs.tag }}
              run: |
                  if git ls-remote --exit-code --heads origin "release/${TAG}" >/dev/null; then
                    git push origin --delete "release/${TAG}"
                  fi

    # Runs after `release` has published the tag the cut pushed.
    announce:
        needs: [cut, release]
        if: inputs.mode == 'cut' && needs.release.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ needs.cut.outputs.tag }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: release-notes
                  path: ${{ runner.temp }}

            - name: Create the GitHub Release
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "GitHub Release ${TAG} already exists."
                  else
                    gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
                      --notes-file "$RUNNER_TEMP/release-notes.md" --latest --verify-tag
                  fi

    # The only job that can publish. It must stay the last job in this file: its
    # stored-credential guard scans from its own header down.
    release:
        needs: cut
        # Forks and clones must not be able to dispatch a publish that claims to
        # be this repository.
        if: >-
            always() && github.repository == 'compiled-run/markless' &&
            (inputs.mode == 'dry-run' || inputs.mode == 'publish' ||
            (inputs.mode == 'cut' && needs.cut.result == 'success'))
        runs-on: ubuntu-latest
        # About 5 minutes of build and upload, plus two 20-minute bounded waits for npm processing.
        timeout-minutes: 60
        permissions:
            contents: read
            # The whole mechanism. Lets GitHub mint the OIDC token npm trades
            # with the registry in place of a stored credential.
            id-token: write
        env:
            NPM_CONFIG_AUDIT: 'false'
            NPM_CONFIG_FUND: 'false'
            RELEASE_VERSION: ${{ needs.cut.outputs.version || inputs.version }}
            RELEASE_MODE: ${{ inputs.mode == 'cut' && 'publish' || inputs.mode }}
            RELEASE_CONFIRM: ${{ inputs.confirm }}
            RELEASE_DIST_TAG: ${{ inputs.dist_tag }}

        steps:
            - uses: actions/checkout@v4
              with:
                  # A cut publishes the tag its `cut` job pushed, not the dispatched ref.
                  ref: ${{ needs.cut.outputs.tag || github.ref }}

            - name: Refuse to run with a stored npm token available
              run: |
                  set -euo pipefail
                  failed=0
                  # actions/setup-node exports this literal placeholder when it
                  # is given a registry-url, so its .npmrc template resolves. It
                  # is not a credential, and npm's own recommended
                  # trusted-publishing workflow produces it. This step currently
                  # runs before setup-node, but stays placeholder-aware so
                  # reordering the steps cannot turn a correct configuration
                  # into a confusing failure.
                  placeholder='XXXXX-XXXXX-XXXXX-XXXXX'
                  for name in NODE_AUTH_TOKEN NPM_TOKEN; do
                    value="$(printenv "$name" || true)"
                    if [ -n "$value" ] && [ "$value" != "$placeholder" ]; then
                      echo "::error::$name is set to a real value in this job. This release publishes via OIDC trusted publishing; a stored token would mean nothing about trusted publishing was proven."
                      failed=1
                    fi
                  done
                  # A future edit that wires a stored credential back in must
                  # fail here rather than quietly publish with a token again.
                  # Comment lines are excluded so the explanation above can name
                  # the thing it forbids. The scan covers this job, which is last in
                  # the file; no other job reads a secret either, and none can publish.
                  if sed -n '/^    release:$/,$p' .github/workflows/release.yml | grep -vE '^[[:space:]]*#' | grep -nE 'secrets\.'; then
                    echo "::error::The publishing job reads a repository secret. Trusted publishing must use no stored credential."
                    failed=1
                  fi
                  if [ "$failed" -ne 0 ]; then exit 1; fi
                  echo "no stored npm credential is present in this job"

            - name: Require the typed confirmation phrase
              if: inputs.mode == 'publish'
              run: |
                  set -euo pipefail
                  expected="publish markless ${RELEASE_VERSION}"
                  if [ "$RELEASE_CONFIRM" != "$expected" ]; then
                    echo "::error::confirm must be exactly: ${expected}"
                    exit 1
                  fi
                  echo "confirmation accepted for ${RELEASE_VERSION}"

            - name: Publish only the tagged release commit
              if: env.RELEASE_MODE == 'publish'
              run: |
                  set -euo pipefail
                  tagged="$(git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}^{commit}" || true)"
                  if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
                    echo "::error::A publish runs at the v${RELEASE_VERSION} tag, and the checked-out commit is not it. Release with mode=cut, or dispatch publish at the tag."
                    exit 1
                  fi
                  echo "publishing the commit tagged v${RELEASE_VERSION}"

            # No `version:` here on purpose: pnpm/action-setup reads
            # packageManager from package.json, so the pnpm that publishes is
            # the pnpm this repo pins. A second copy here could drift from it.
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  # Writes an .npmrc pointing at the public registry. It carries
                  # no token; npm falls back to the OIDC exchange.
                  registry-url: 'https://registry.npmjs.org'
                  cache: pnpm

            # `pnpm publish` packs the tarball itself (which is what rewrites the
            # workspace: and catalog: ranges) and then shells out to whatever
            # `npm` is on PATH to do the upload. So the npm pinned here is the
            # binary that performs the OIDC exchange and generates provenance.
            - name: Pin and verify the npm CLI that performs the OIDC exchange
              run: |
                  set -euo pipefail
                  npm install -g npm@11.18.0
                  echo "which npm: $(which npm)"
                  echo "npm --version: $(npm --version)"
                  node -e '
                    const floor = [11, 5, 1];
                    const actual = process.argv[1].trim().split(".").map(Number);
                    for (let index = 0; index < floor.length; index += 1) {
                      const part = actual[index] ?? 0;
                      if (part > floor[index]) break;
                      if (part < floor[index]) {
                        console.error(`npm ${process.argv[1]} is below the ${floor.join(".")} trusted-publishing floor`);
                        process.exit(1);
                      }
                    }
                    console.log(`npm ${process.argv[1]} supports trusted publishing`);
                  ' "$(npm --version)"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # After the install: the release set is read from pnpm-workspace.yaml with the yaml package.
            - name: Assert the dispatched version matches every manifest
              run: node scripts/release/assert-release-version.mjs "$RELEASE_VERSION"

            - name: Build publishable output
              run: pnpm build

            - name: Guard sweep — every release package is publish-ready
              run: node scripts/release/verify-publish-ready.mjs --all

            - name: Verify the tarballs a publish would actually upload
              run: node scripts/release/verify-packed-manifests.mjs

            - name: Dry run — pack and validate, no registry write
              if: env.RELEASE_MODE == 'dry-run'
              env:
                  # Provenance generation needs a real OIDC exchange, which a dry
                  # run cannot perform, so it must be off here. This is the ONLY
                  # place this job touches the provenance setting: on the
                  # real path it comes from each package's
                  # publishConfig.provenance, which is the package's own fact.
                  NPM_CONFIG_PROVENANCE: 'false'
              run: |
                  echo "::notice::A green dry run proves packaging, version lockstep and registry reachability. It does NOT prove the OIDC exchange or provenance. Only a publish-mode run proves those."
                  node scripts/release/publish-workspace.mjs --version "$RELEASE_VERSION" --tag "$RELEASE_DIST_TAG" --dry-run

            - name: Publish to npm via trusted publishing
              if: env.RELEASE_MODE == 'publish'
              run: node scripts/release/publish-workspace.mjs --version "$RELEASE_VERSION" --tag "$RELEASE_DIST_TAG"

            # The failure this catches: everything publishes, the run goes green,
            # and npm attached no attestation, so trusted publishing never
            # actually took effect and nobody notices.
            - name: Assert npm recorded a provenance attestation for every package
              if: env.RELEASE_MODE == 'publish'
              run: node scripts/release/verify-provenance.mjs --version "$RELEASE_VERSION"

            - name: Report the publish
              if: env.RELEASE_MODE == 'publish'
              run: |
                  echo "Published ${RELEASE_VERSION} with provenance."
                  echo "In mode=cut the announce job creates the GitHub release for v${RELEASE_VERSION} next."
