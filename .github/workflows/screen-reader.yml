name: Screen reader

# Announcement-level accessibility proof for @markless/ui. Separate from ci.yml
# on purpose: two of these jobs need Windows and macOS runners with an assistive
# technology installed, which is a different cost class from the Linux CI matrix.
#
# Three lanes, cheapest first:
#   virtual  - a screen reader written in JavaScript, no assistive technology
#              needed. Runs on every touched PR, required green.
#   nvda     - the real NVDA screen reader on Windows. Required green.
#   voiceover- the real VoiceOver screen reader on macOS. Advisory, see below.
#
# The matrix key is the component family. A new family adds its name to each
# matrix and nothing else changes.
#
# The two real-reader lanes read a served page: apps/sr-gallery renders every
# family's Basic scenario, and each family's <family>.nvda.ts / .voiceover.ts,
# colocated under packages/headless/components/src/<family>/, drives NVDA or
# VoiceOver over it with the same transcript expectations the virtual lane
# uses. The gallery is built and booted first, in its own step, because a page
# that never rendered and a reader that never spoke look identical downstream.
# If that step fails the lane falls back to the drivability smoke, which is the
# proof no developer machine can reproduce and the one worth keeping either way.

on:
    pull_request:
        paths:
            - 'packages/headless/**'
            - 'apps/sr-gallery/**'
            - '.github/workflows/screen-reader.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/headless/**'
            - 'apps/sr-gallery/**'
            - '.github/workflows/screen-reader.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: screen-reader-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'
    NPM_CONFIG_PREFER_OFFLINE: 'true'

jobs:
    # The always-on lane. Same transcript expectations the real readers will
    # run, driven by @guidepup/virtual-screen-reader inside the existing
    # Chromium browser project, so it needs nothing a Linux runner lacks.
    virtual:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                # Every family with a src/<family>/<family>.sr.ts. One job per
                # family, so a red lane names the family in its own job title.
                family:
                    [
                        checkbox,
                        checklist,
                        collapsible,
                        otp,
                        pagination,
                        progress,
                        qr-code,
                        radio-group,
                        tabs,
                        textbox,
                        toggle,
                    ]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers for the vitest browser project
              run: pnpm --dir packages/vitest-browser exec playwright install --with-deps chromium

            - name: Typecheck the screen-reader lanes
              run: pnpm typecheck:sr

            - name: Typecheck the real-reader lane
              run: pnpm typecheck:sr-real

            - name: Read the ${{ matrix.family }} family with the virtual screen reader
              run: pnpm test:sr -- src/${{ matrix.family }}/${{ matrix.family }}.sr.ts

    # Real NVDA on a real Windows desktop session. guidepup/setup-action
    # installs NVDA and the keyboard automation it needs.
    nvda:
        runs-on: windows-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                # Only families with a real-reader spec. A family joins this list
                # when its src/<family>/<family>.nvda.ts exists, not before: a
                # name with no spec file makes the run find no tests.
                family: [checkbox]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Install NVDA and its automation dependencies
              uses: guidepup/setup-action@v3

            - name: Install the browser the reader reads through
              run: pnpm exec playwright install --with-deps chromium

            # Its own step, and allowed to fail: this is the gate that decides
            # whether the reader gets a page to read. It serves the gallery,
            # loads it, and checks every family rendered.
            - name: Serve and render the screen-reader gallery
              id: gallery
              continue-on-error: true
              run: node apps/sr-gallery/scripts/boot-check.ts

            - name: Read the ${{ matrix.family }} family with NVDA
              if: steps.gallery.outcome == 'success'
              run: pnpm test:sr-real -- --project=nvda ${{ matrix.family }}/${{ matrix.family }}.nvda.ts

            # Fallback, not a pass: the gallery did not render, so this proves
            # only that the runner can drive the reader at all.
            - name: Prove the runner can drive NVDA
              if: steps.gallery.outcome != 'success'
              run: node scripts/ci/screen-reader-smoke.mjs nvda

    # Real VoiceOver on macOS. Advisory on purpose, and this is the whole
    # reason: guidepup/setup-action grants VoiceOver automation by writing the
    # runner's TCC permission database directly, and every macOS runner image
    # update can break that write. A broken image would otherwise block every
    # unrelated pull request that touches packages/headless.
    #
    # continue-on-error is not permission to ignore this job, and removing the
    # job is not a fix. A red VoiceOver lane is triaged like any other red: if
    # the failure is a real announcement regression it blocks the change, and if
    # it is the setup step it goes in the ledger with the runner image version.
    voiceover:
        runs-on: macos-latest
        timeout-minutes: 25
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                # See the nvda job: only families with a real-reader spec.
                family: [checkbox]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Grant VoiceOver automation permission
              uses: guidepup/setup-action@v3

            - name: Install the browser the reader reads through
              run: pnpm exec playwright install --with-deps chromium

            - name: Serve and render the screen-reader gallery
              id: gallery
              continue-on-error: true
              run: node apps/sr-gallery/scripts/boot-check.ts

            - name: Read the ${{ matrix.family }} family with VoiceOver
              if: steps.gallery.outcome == 'success'
              run: pnpm test:sr-real -- --project=voiceover ${{ matrix.family }}/${{ matrix.family }}.voiceover.ts

            - name: Prove the runner can drive VoiceOver
              if: steps.gallery.outcome != 'success'
              run: node scripts/ci/screen-reader-smoke.mjs voiceover
