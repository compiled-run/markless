name: Screen reader

# Announcement-level accessibility proof for @markless/ui. Separate from ci.yml
# on purpose: two of these jobs need Windows and macOS runners with an assistive
# technology installed, which is a different cost class from the Linux CI matrix.
#
# Three lanes, cheapest first:
#   virtual  - a screen reader written in JavaScript, no assistive technology
#              needed. Runs on every touched PR, required green.
#   nvda     - the real NVDA screen reader on Windows. Required green.
#   voiceover- the real VoiceOver screen reader on macOS. Advisory, see below.
#
# The matrix key is the component family. A new family adds its name to each
# matrix and nothing else changes.
#
# The two real-reader lanes read a served page: packages/headless/sr-app renders every
# family's Basic scenario, and each family's <family>.nvda.ts / .voiceover.ts,
# colocated under packages/headless/components/src/<family>/, drives NVDA or
# VoiceOver over it with the same transcript expectations the virtual lane
# uses. The gallery is built and booted first, in its own step, because a page
# that never rendered and a reader that never spoke look identical downstream.
# If that step fails the lane falls back to the drivability smoke, which is the
# proof no developer machine can reproduce and the one worth keeping either way.

on:
    pull_request:
        paths:
            - 'packages/headless/**'
            - 'packages/headless/sr-app/**'
            - '.github/workflows/screen-reader.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/headless/**'
            - 'packages/headless/sr-app/**'
            - '.github/workflows/screen-reader.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: screen-reader-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'
    NPM_CONFIG_PREFER_OFFLINE: 'true'
    # Beside the checkout, as in ci.yml, so a lint of the tree never sees the browsers.
    PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}-ms-playwright
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
    # One Chromium download per operating system per lockfile, restored by every
    # family below. Each family used to download its own copy, so about a hundred
    # downloads ran per push and one CDN error (a TLS name mismatch on
    # cdn.playwright.dev, a DNS miss on the Microsoft mirror) failed a
    # different family each run. A family whose restore fails downloads instead.
    prepare-playwright:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Restore the Chromium cache
              id: playwright-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-sr-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-ms-playwright

            - name: Look up the cached Playwright system packages
              id: apt-cache
              if: runner.os == 'Linux'
              uses: actions/cache/restore@v4
              with:
                  key: playwright-sr-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-playwright-apt
                  lookup-only: true

            - name: Install Markless dependencies
              if: steps.playwright-cache.outputs.cache-hit != 'true' || (runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true')
              run: pnpm install --frozen-lockfile

            - name: Download the pinned Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm exec playwright install chromium

            - name: Save the Chromium cache
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  key: playwright-sr-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-ms-playwright

            - name: Download the Playwright system packages
              if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: |
                  echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages
                  pnpm exec playwright install-deps chromium
                  mkdir -p ${{ github.workspace }}-playwright-apt
                  cp /var/cache/apt/archives/*.deb ${{ github.workspace }}-playwright-apt/

            - name: Save the Playwright system packages
              if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  key: playwright-sr-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-playwright-apt

    # The always-on lane. Same transcript expectations the real readers will
    # run, driven by @guidepup/virtual-screen-reader inside the existing
    # Chromium browser project, so it needs nothing a Linux runner lacks.
    virtual:
        needs: prepare-playwright
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                # Every family with a src/<family>/<family>.sr.ts. One job per
                # family, so a red lane names the family in its own job title.
                family:
                    [
                        accordion,
                        buttongroup,
                        calendar,
                        carousel,
                        checkbox,
                        checklist,
                        collapsible,
                        colorpicker,
                        combobox,
                        crop,
                        datebox,
                        drawer,
                        editable,
                        fileupload,
                        gridlist,
                        hovercard,
                        ink,
                        menu,
                        menubar,
                        modal,
                        navbar,
                        numberbox,
                        otp,
                        pad,
                        pagination,
                        popover,
                        progress,
                        qr-code,
                        radio-group,
                        rating,
                        resizable,
                        select,
                        slider,
                        table,
                        tabs,
                        taglist,
                        textbox,
                        timebox,
                        toaster,
                        toggle,
                        toolbar,
                        tooltip,
                        tour,
                        tree,
                    ]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Restore the Chromium the prepare job downloaded
              id: browser-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-sr-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-ms-playwright

            # The cache and the CDN fail independently (cache egress throttling, CDN TLS and DNS errors), so one covers the other.
            - name: Download Chromium when the cache could not be restored
              if: steps.browser-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm exec playwright install chromium

            - name: Restore the Playwright system packages
              id: apt-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-sr-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-playwright-apt

            - name: Install Playwright system dependencies
              run: |
                  if [ '${{ steps.apt-cache.outputs.cache-hit }}' = true ]; then sudo cp ${{ github.workspace }}-playwright-apt/*.deb /var/cache/apt/archives/; fi
                  pnpm exec playwright install-deps chromium

            - name: Typecheck the screen-reader lanes
              run: pnpm typecheck:sr

            - name: Typecheck the real-reader lane
              run: pnpm typecheck:sr-real

            - name: Read the ${{ matrix.family }} family with the virtual screen reader
              run: pnpm test:sr src/${{ matrix.family }}/${{ matrix.family }}.sr.ts

    # Real NVDA on a real Windows desktop session. guidepup/setup-action
    # installs NVDA and the keyboard automation it needs.
    nvda:
        needs: prepare-playwright
        runs-on: windows-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                # Only families with a real-reader spec. A family joins this list
                # when its src/<family>/<family>.nvda.ts exists, not before: a
                # name with no spec file makes the run find no tests.
                family:
                    [
                        buttongroup,
                        calendar,
                        checkbox,
                        colorpicker,
                        crop,
                        datebox,
                        drawer,
                        editable,
                        gridlist,
                        hovercard,
                        ink,
                        menu,
                        menubar,
                        modal,
                        numberbox,
                        pad,
                        popover,
                        radio-group,
                        rating,
                        resizable,
                        select,
                        slider,
                        table,
                        tabs,
                        taglist,
                        timebox,
                        toolbar,
                        tooltip,
                        tour,
                    ]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Install NVDA and its automation dependencies
              uses: guidepup/setup-action@0.21.0

            # The action configures the OS; the reader build guidepup drives is a per-project asset.
            - name: Install the screen reader assets guidepup drives
              run: pnpm dlx @guidepup/setup@0.28.0 install

            - name: Restore the Chromium the prepare job downloaded
              id: browser-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-sr-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-ms-playwright

            # The cache and the CDN fail independently (cache egress throttling, CDN TLS and DNS errors), so one covers the other.
            - name: Download Chromium when the cache could not be restored
              if: steps.browser-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm exec playwright install chromium

            # Its own step, and allowed to fail: this is the gate that decides
            # whether the reader gets a page to read. It serves the gallery,
            # loads it, and checks every family rendered.
            - name: Serve and render the screen-reader gallery
              id: gallery
              continue-on-error: true
              run: node packages/headless/sr-app/scripts/boot-check.ts

            # continue-on-error so the transcript is still uploaded and summarised
            # when the read fails; the gate step below turns that back into red.
            - name: Read the ${{ matrix.family }} family with NVDA
              id: read
              if: steps.gallery.outcome == 'success'
              continue-on-error: true
              shell: bash
              run: |
                  mkdir -p sr-transcripts
                  set -o pipefail
                  pnpm test:sr-real --project=nvda ${{ matrix.family }}/${{ matrix.family }}.nvda.ts 2>&1 \
                      | tee sr-transcripts/nvda-${{ matrix.family }}.txt

            - name: Upload the ${{ matrix.family }} NVDA transcript
              if: always() && steps.gallery.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: nvda-transcript-${{ matrix.family }}
                  path: |
                      sr-transcripts/
                      packages/headless/components/test-support/test-results/
                  if-no-files-found: warn

            - name: Summarise the ${{ matrix.family }} NVDA read
              if: always()
              shell: bash
              env:
                  FAMILY: ${{ matrix.family }}
                  GALLERY: ${{ steps.gallery.outcome }}
                  READ: ${{ steps.read.outcome }}
              run: |
                  {
                      echo "### NVDA - $FAMILY"
                      if [ "$GALLERY" != 'success' ]; then
                          echo 'not read: the gallery did not render, so only the drivability smoke ran.'
                      elif [ "$READ" = 'success' ]; then
                          echo 'pass'
                      else
                          echo 'FAIL - end of the transcript:'
                          echo '```'
                          tail -n 40 "sr-transcripts/nvda-$FAMILY.txt" 2>/dev/null || echo 'no transcript was captured.'
                          echo '```'
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Fail when NVDA could not read the ${{ matrix.family }} family
              if: steps.gallery.outcome == 'success' && steps.read.outcome != 'success'
              run: exit 1

            # Fallback, not a pass: the gallery did not render, so this proves
            # only that the runner can drive the reader at all.
            - name: Prove the runner can drive NVDA
              if: steps.gallery.outcome != 'success'
              run: node scripts/ci/screen-reader-smoke.mjs nvda

    # Real VoiceOver on macOS. Advisory on purpose, and this is the whole
    # reason: guidepup/setup-action grants VoiceOver automation by writing the
    # runner's TCC permission database directly, and every macOS runner image
    # update can break that write. A broken image would otherwise block every
    # unrelated pull request that touches packages/headless.
    #
    # continue-on-error is not permission to ignore this job, and removing the
    # job is not a fix. A red VoiceOver lane is triaged like any other red: if
    # the failure is a real announcement regression it blocks the change, and if
    # it is the setup step it goes in the ledger with the runner image version.
    voiceover:
        needs: prepare-playwright
        runs-on: macos-latest
        timeout-minutes: 25
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                # See the nvda job: only families with a real-reader spec.
                family:
                    [
                        buttongroup,
                        calendar,
                        checkbox,
                        colorpicker,
                        crop,
                        datebox,
                        drawer,
                        editable,
                        gridlist,
                        hovercard,
                        ink,
                        menu,
                        menubar,
                        modal,
                        numberbox,
                        pad,
                        popover,
                        radio-group,
                        rating,
                        resizable,
                        select,
                        slider,
                        table,
                        tabs,
                        taglist,
                        timebox,
                        toolbar,
                        tooltip,
                        tour,
                    ]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Grant VoiceOver automation permission
              uses: guidepup/setup-action@0.21.0

            # The action configures the OS; the reader build guidepup drives is a per-project asset.
            - name: Install the screen reader assets guidepup drives
              run: pnpm dlx @guidepup/setup@0.28.0 install

            - name: Restore the Chromium the prepare job downloaded
              id: browser-cache
              uses: actions/cache/restore@v4
              with:
                  key: playwright-sr-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  path: ${{ github.workspace }}-ms-playwright

            # The cache and the CDN fail independently (cache egress throttling, CDN TLS and DNS errors), so one covers the other.
            - name: Download Chromium when the cache could not be restored
              if: steps.browser-cache.outputs.cache-hit != 'true'
              timeout-minutes: 10
              run: pnpm exec playwright install chromium

            - name: Serve and render the screen-reader gallery
              id: gallery
              continue-on-error: true
              run: node packages/headless/sr-app/scripts/boot-check.ts

            # See the nvda job: the read is allowed to fail so its transcript is
            # still uploaded and summarised, and the gate step below re-reds it.
            - name: Read the ${{ matrix.family }} family with VoiceOver
              id: read
              if: steps.gallery.outcome == 'success'
              continue-on-error: true
              shell: bash
              run: |
                  mkdir -p sr-transcripts
                  set -o pipefail
                  pnpm test:sr-real --project=voiceover ${{ matrix.family }}/${{ matrix.family }}.voiceover.ts 2>&1 \
                      | tee sr-transcripts/voiceover-${{ matrix.family }}.txt

            - name: Upload the ${{ matrix.family }} VoiceOver transcript
              if: always() && steps.gallery.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: voiceover-transcript-${{ matrix.family }}
                  path: |
                      sr-transcripts/
                      packages/headless/components/test-support/test-results/
                  if-no-files-found: warn

            - name: Summarise the ${{ matrix.family }} VoiceOver read
              if: always()
              shell: bash
              env:
                  FAMILY: ${{ matrix.family }}
                  GALLERY: ${{ steps.gallery.outcome }}
                  READ: ${{ steps.read.outcome }}
              run: |
                  {
                      echo "### VoiceOver - $FAMILY"
                      if [ "$GALLERY" != 'success' ]; then
                          echo 'not read: the gallery did not render, so only the drivability smoke ran.'
                      elif [ "$READ" = 'success' ]; then
                          echo 'pass'
                      else
                          echo 'FAIL - end of the transcript:'
                          echo '```'
                          tail -n 40 "sr-transcripts/voiceover-$FAMILY.txt" 2>/dev/null || echo 'no transcript was captured.'
                          echo '```'
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Fail when VoiceOver could not read the ${{ matrix.family }} family
              if: steps.gallery.outcome == 'success' && steps.read.outcome != 'success'
              run: exit 1

            - name: Prove the runner can drive VoiceOver
              if: steps.gallery.outcome != 'success'
              run: node scripts/ci/screen-reader-smoke.mjs voiceover
