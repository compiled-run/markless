name: Screen reader

# Announcement-level accessibility proof for @markless/ui. Separate from ci.yml
# on purpose: two of these jobs need Windows and macOS runners with an assistive
# technology installed, which is a different cost class from the Linux CI matrix.
#
# Three lanes, cheapest first:
#   virtual  - a screen reader written in JavaScript, no assistive technology
#              needed. One job per family on Linux, required green.
#   nvda     - the real NVDA screen reader on Windows.
#   voiceover- the real VoiceOver screen reader on macOS. Advisory, see below.
#
# The virtual matrix key is the family. The real-reader lanes run their
# families in four shards that both lanes share: a Windows or macOS runner is
# the scarce cost, and one family per job made a run 29 macOS jobs. A new
# family with a real-reader spec joins one shard's list.
#
# The two real-reader lanes read a served page: packages/headless/sr-app renders every
# family's Basic scenario, and each family's <family>.nvda.ts / .voiceover.ts,
# colocated under packages/headless/components/src/<family>/, drives NVDA or
# VoiceOver over it with the same transcript expectations the virtual lane
# uses. The gallery is booted first, in its own step, because a page that never
# rendered and a reader that never spoke look identical downstream. A gallery
# that does not render fails the job: the drivability smoke still runs, to say
# whether the reader works, but it is never a pass on its own.

on:
    pull_request:
        paths:
            - 'packages/headless/**'
            - 'packages/headless/sr-app/**'
            - '.github/workflows/screen-reader.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/headless/**'
            - 'packages/headless/sr-app/**'
            - '.github/workflows/screen-reader.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: screen-reader-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'
    NPM_CONFIG_PREFER_OFFLINE: 'true'

jobs:
    # The always-on lane. Same transcript expectations the real readers will
    # run, driven by @guidepup/virtual-screen-reader inside the existing
    # Chromium browser project, so it needs nothing a Linux runner lacks.
    virtual:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                # Every family with a src/<family>/<family>.sr.ts. One job per
                # family, so a red lane names the family in its own job title.
                family:
                    [
                        accordion,
                        buttongroup,
                        calendar,
                        carousel,
                        checkbox,
                        checklist,
                        collapsible,
                        colorpicker,
                        combobox,
                        crop,
                        datebox,
                        drawer,
                        editable,
                        fileupload,
                        gridlist,
                        hovercard,
                        ink,
                        menu,
                        menubar,
                        modal,
                        navbar,
                        numberbox,
                        otp,
                        pad,
                        pagination,
                        popover,
                        progress,
                        qr-code,
                        radio-group,
                        rating,
                        resizable,
                        select,
                        slider,
                        table,
                        tabs,
                        taglist,
                        textbox,
                        timebox,
                        toaster,
                        toggle,
                        toolbar,
                        tooltip,
                        tour,
                        tree,
                    ]

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers for the vitest browser project
              run: pnpm --dir packages/vitest-browser exec playwright install --with-deps chromium

            - name: Typecheck the screen-reader lanes
              run: pnpm typecheck:sr

            - name: Typecheck the real-reader lane
              run: pnpm typecheck:sr-real

            - name: Read the ${{ matrix.family }} family with the virtual screen reader
              run: pnpm test:sr src/${{ matrix.family }}/${{ matrix.family }}.sr.ts

    # Real NVDA on a real Windows desktop session. guidepup/setup-action
    # installs NVDA and the keyboard automation it needs.
    nvda:
        runs-on: windows-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # Only families with a real-reader spec: a name with no spec file
                # makes the run find no tests. Same shards as the voiceover job.
                include:
                    - shard: 1
                      families: buttongroup calendar checkbox colorpicker crop datebox drawer
                    - shard: 2
                      families: editable gridlist hovercard ink menu menubar modal
                    - shard: 3
                      families: numberbox pad popover radio-group rating resizable select
                    - shard: 4
                      families: slider table tabs taglist timebox toolbar tooltip tour

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            - name: Install NVDA and its automation dependencies
              uses: guidepup/setup-action@0.21.0

            # The action configures the OS; the reader build guidepup drives is a per-project asset.
            - name: Install the screen reader assets guidepup drives
              run: pnpm dlx @guidepup/setup@0.28.0 install

            - name: Install the browser the reader reads through
              run: pnpm exec playwright install --with-deps chromium

            - name: Serve and render the screen-reader gallery
              id: gallery
              continue-on-error: true
              run: node packages/headless/sr-app/scripts/boot-check.ts

            # continue-on-error so the transcript is still uploaded and summarised
            # when the read fails; the gate step below turns that back into red.
            - name: Read shard ${{ matrix.shard }} with NVDA
              id: read
              if: steps.gallery.outcome == 'success'
              continue-on-error: true
              shell: bash
              env:
                  READER_PROJECT: nvda
                  FAMILIES: ${{ matrix.families }}
                  TRANSCRIPT: sr-transcripts/nvda-shard-${{ matrix.shard }}.txt
              run: node scripts/ci/screen-reader-read.mjs

            - name: Upload the shard ${{ matrix.shard }} NVDA transcript
              if: always() && steps.gallery.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: nvda-transcript-shard-${{ matrix.shard }}
                  path: |
                      sr-transcripts/
                      packages/headless/components/test-support/test-results/
                  if-no-files-found: warn

            - name: Summarise the shard ${{ matrix.shard }} NVDA read
              if: always()
              shell: bash
              env:
                  READER: NVDA
                  FAMILIES: ${{ matrix.families }}
                  TRANSCRIPT: sr-transcripts/nvda-shard-${{ matrix.shard }}.txt
                  GALLERY: ${{ steps.gallery.outcome }}
              run: node scripts/ci/screen-reader-summary.mjs >> "$GITHUB_STEP_SUMMARY"

            - name: Prove the runner can drive NVDA
              if: steps.gallery.outcome != 'success'
              continue-on-error: true
              run: node scripts/ci/screen-reader-smoke.mjs nvda

            - name: Fail when NVDA did not read shard ${{ matrix.shard }}
              if: steps.gallery.outcome != 'success' || steps.read.outcome != 'success'
              run: exit 1

    # Real VoiceOver on macOS. Still advisory: until October 2026 this lane never
    # read a family (its "VoiceOver not running" was the fixture stopping the
    # reader after a 5-minute walk that could not match VoiceOver's phrases), and
    # it stays advisory until it has run green three times in a row with real
    # announcements asserted. The families that still fail on what VoiceOver
    # actually says are listed in docs/ci-process.md under "Screen-reader lanes".
    #
    # continue-on-error is not permission to ignore this job, and removing the
    # job is not a fix. A red VoiceOver lane is triaged like any other red: if
    # the failure is a real announcement regression it blocks the change, and if
    # it is the setup step it goes in the ledger with the runner image version.
    voiceover:
        runs-on: macos-latest
        timeout-minutes: 60
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                # See the nvda job: the same shards.
                include:
                    - shard: 1
                      families: buttongroup calendar checkbox colorpicker crop datebox drawer
                    - shard: 2
                      families: editable gridlist hovercard ink menu menubar modal
                    - shard: 3
                      families: numberbox pad popover radio-group rating resizable select
                    - shard: 4
                      families: slider table tabs taglist timebox toolbar tooltip tour

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Markless dependencies
              run: pnpm install --frozen-lockfile

            # Not guidepup/setup-action@0.21.0: its bundled @guidepup/setup 0.23 writes TCC.db row by row and
            # sometimes fails on macos-26 images; 0.29 writes one root transaction with backoff, as guidepup's own CI.
            - name: Grant VoiceOver automation permission
              run: pnpm dlx @guidepup/setup@0.29.3 setup --ci

            - name: Install the screen reader assets guidepup drives
              run: pnpm dlx @guidepup/setup@0.29.3 install

            - name: Record the VoiceOver verbosity defaults (diagnostic)
              run: defaults read com.apple.VoiceOver4/default | grep -i -E "hint|verbos|follow|focus" || true

            - name: Install the browser the reader reads through
              run: pnpm exec playwright install --with-deps chromium

            - name: Serve and render the screen-reader gallery
              id: gallery
              continue-on-error: true
              run: node packages/headless/sr-app/scripts/boot-check.ts

            # See the nvda job: the read is allowed to fail so its transcript is
            # still uploaded and summarised, and the gate step below re-reds it.
            - name: Read shard ${{ matrix.shard }} with VoiceOver
              id: read
              if: steps.gallery.outcome == 'success'
              continue-on-error: true
              shell: bash
              env:
                  READER_PROJECT: voiceover
                  FAMILIES: ${{ matrix.families }}
                  TRANSCRIPT: sr-transcripts/voiceover-shard-${{ matrix.shard }}.txt
              run: node scripts/ci/screen-reader-read.mjs

            - name: Upload the shard ${{ matrix.shard }} VoiceOver transcript
              if: always() && steps.gallery.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: voiceover-transcript-shard-${{ matrix.shard }}
                  path: |
                      sr-transcripts/
                      packages/headless/components/test-support/test-results/
                  if-no-files-found: warn

            - name: Summarise the shard ${{ matrix.shard }} VoiceOver read
              if: always()
              shell: bash
              env:
                  READER: VoiceOver
                  FAMILIES: ${{ matrix.families }}
                  TRANSCRIPT: sr-transcripts/voiceover-shard-${{ matrix.shard }}.txt
                  GALLERY: ${{ steps.gallery.outcome }}
              run: node scripts/ci/screen-reader-summary.mjs >> "$GITHUB_STEP_SUMMARY"

            - name: Prove the runner can drive VoiceOver
              if: steps.gallery.outcome != 'success'
              continue-on-error: true
              run: node scripts/ci/screen-reader-smoke.mjs voiceover

            - name: Fail when VoiceOver did not read shard ${{ matrix.shard }}
              if: steps.gallery.outcome != 'success' || steps.read.outcome != 'success'
              run: exit 1
