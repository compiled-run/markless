name: Stale merge-queue runs

# A merge queue rebuild deletes its gh-readonly-queue/* branches but leaves their runs waiting for runners: on
# 2026-10-28 five such runs, about 32 jobs each, queued behind the live groups. This cancels a merge_group run
# whose branch is gone, and lists what it cancelled.
# A rebuild requests new merge-queue CI runs, so each request sweeps; under load GitHub ran the schedule 4 times in 30 hours.
on:
    workflow_run:
        workflows: [CI]
        types: [requested]
    schedule:
        - cron: '*/10 * * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cancel:
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'merge_group'
        # On the job, so a pull request's skipped run cannot replace a pending sweep in the group.
        concurrency:
            group: stale-queue-runs
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Cancel merge_group runs whose queue branch is gone
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  echo '| Run | Workflow | Branch |' >> "$GITHUB_STEP_SUMMARY"
                  echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
                  for status in queued in_progress waiting pending requested; do
                    gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&status=$status&per_page=100" \
                      --jq '.workflow_runs[] | [.id, .name, .head_branch] | @tsv'
                  done | sort -u | while IFS=$'\t' read -r id name branch; do
                    encoded=$(jq -rn --arg b "$branch" '$b | @uri')
                    if gh api "repos/$GITHUB_REPOSITORY/branches/$encoded" --silent 2>/dev/null; then continue; fi
                    gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" --silent || true
                    sleep 5
                    if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status)" != completed ]; then
                      gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" --silent || true
                    fi
                    echo "cancelled $id ($name) on $branch"
                    echo "| $id | $name | $branch |" >> "$GITHUB_STEP_SUMMARY"
                  done

            # A self-hosted job waits up to 24 hours for its runner, so a dead Mac mini would hold every group until the
            # queue's 240-minute timeout. Cancelling the run lets the queue drop the entry and rebuild the groups behind it.
            - name: Cancel merge_group runs stuck waiting for a self-hosted runner
              env:
                  GH_TOKEN: ${{ github.token }}
                  STUCK_MINUTES: 15
              run: |
                  set -euo pipefail
                  cutoff=$(date -u -d "-${STUCK_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
                  for status in queued in_progress; do
                    gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&status=$status&per_page=100" \
                      --jq '.workflow_runs[] | [.id, .head_branch] | @tsv'
                  done | sort -u | while IFS=$'\t' read -r id branch; do
                    stuck=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                      --jq ".jobs[] | select(.status == \"queued\" and .created_at < \"$cutoff\")
                        | select(all(.labels[]; test(\"^(ubuntu|macos|windows)-\") | not)) | .name")
                    [ -n "$stuck" ] || continue
                    gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" --silent || true
                    echo "::warning::cancelled merge_group run $id on $branch: $(echo "$stuck" | paste -sd, -) waited over ${STUCK_MINUTES} minutes for a self-hosted runner"
                    echo "| $id | CI, self-hosted runner did not answer | $branch |" >> "$GITHUB_STEP_SUMMARY"
                  done
