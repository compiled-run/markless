<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>tap</title>
<style>body{font:16px system-ui;margin:12px}button{font-size:22px;padding:24px 40px}#out{font-size:10px;white-space:pre-wrap}</style></head>
<body><button id="b">Press</button><button id="t" style="touch-action:manipulation">Manip</button><pre id="out"></pre>
<script>
const out=document.getElementById('out'); let seq=0; const log=[];
function send(r){ r.n=seq++; log.push(r); fetch('/log',{method:'POST',body:JSON.stringify(r)}).catch(()=>{}); out.textContent=log.slice(-16).map(x=>JSON.stringify(x)).join('\n'); }
for (const id of ['b','t']) { const el=document.getElementById(id); for (const type of ['click','dblclick','pointerdown','pointerup']) el.addEventListener(type,(e)=>send({el:id,type,detail:e.detail,pointerType:e.pointerType,t:Math.round(e.timeStamp)})); }
send({type:'ready',ua:navigator.userAgent});
</script></body></html>
