- assertNotVisible: No notes yet
- tapOn: Title
- eraseText
- inputText: Groceries
- assertVisible: Groceries
- assertVisible: Save note
- assertVisible: Groceries
- swipe:
    start: 50%, 36%
    end: 50%, 4%
- assertVisible: Save note
- tapOn: Save note
- assertNotVisible: Save note
- assertVisible: Groceries
- assertVisible: Edit
- assertNotVisible: Save note
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: BackButton
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- assertVisible: Save note
- assertNotVisible: Edit
- assertVisible: Save note
- assertNotVisible: Edit
- runFlow:
