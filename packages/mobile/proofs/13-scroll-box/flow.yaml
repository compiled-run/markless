appId: ${APP_ID}
name: 13-scroll-box
---
- launchApp:
    clearState: true
- assertVisible: Scroll box
- assertVisible: Box row 1
- assertNotVisible: Tapped 1
- assertNotVisible: Box row 30
- assertNotVisible: Page row 20
- assertNotVisible: Tapped 0
- repeat:
    times: 80
    while:
      notVisible: Box row 30
    commands:
      - swipe:
          start: 50%, 48%
          end: 50%, 18%
- assertVisible: Box row 30
- assertVisible: Box row 30
- assertVisible: Scroll box
- assertNotVisible: Page row 20
- repeat:
    times: 80
    while:
      notVisible: Tapped 0
    commands:
      - swipe:
          start: 50%, 90%
          end: 50%, 40%
- assertVisible: Page row 20
- assertNotVisible: Scroll box
- assertVisible: Page row 20
- assertVisible: Tapped 0
- assertNotVisible: Scroll box
- tapOn: Tapped 0
- assertNotVisible: Tapped 0
- assertVisible: Tapped 1
- assertNotVisible: Tapped 0
