appId: ${APP_ID}
name: 14-scroll-row
---
- launchApp:
      clearState: true
- assertVisible: Scroll row
- assertVisible: Card 1
- assertVisible: Below the row
- assertNotVisible: Card 12
- repeat:
      times: 80
      while:
          notVisible: Card 12
      commands:
          - swipe:
                start: 85%, 25%
                end: 15%, 25%
- assertVisible: Card 12
- assertNotVisible: Card 1
- assertVisible: Card 12
- assertVisible: Scroll row
- assertVisible: Below the row
- assertNotVisible: Card 1
