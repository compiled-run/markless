appId: ${APP_ID}
name: d2-haptics
---
- launchApp:
    clearState: true
- assertVisible: Haptics
- assertVisible: Tapped 0
- assertVisible:
    id: markless-device-calls
    text: "calls: none"
- tapOn: Tapped 0
- assertNotVisible: Tapped 0
- assertVisible:
    id: markless-device-calls
    text: "calls: haptics\\.tap"
- assertVisible: Tapped 1
- assertNotVisible: Tapped 0
- assertVisible:
    id: markless-device-calls
    text: "calls: haptics\\.tap"
- tapOn: Tapped 1
- assertNotVisible: Tapped 1
- assertVisible:
    id: markless-device-calls
    text: "calls: haptics\\.tap, haptics\\.tap"
- assertVisible: Tapped 2
- assertNotVisible: Tapped 1
- assertVisible:
    id: markless-device-calls
    text: "calls: haptics\\.tap, haptics\\.tap"
