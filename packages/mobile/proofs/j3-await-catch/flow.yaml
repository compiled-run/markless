appId: ${APP_ID}
name: j3-await-catch
---
- launchApp:
      clearState: true
- assertVisible: Lookup
- assertVisible: 'Result: none'
- assertVisible: 'Steps: 0'
- tapOn: Look up
- assertNotVisible: 'Steps: 0'
- assertVisible: 'Result: none'
- assertVisible: 'Steps: 1'
- assertNotVisible: 'Steps: 0'
- extendedWaitUntil:
      visible: 'Result: FOUND'
      timeout: 14000
- assertNotVisible: 'Result: none'
- assertVisible: 'Result: FOUND'
- assertVisible: 'Steps: 2'
- assertNotVisible: 'Result: none'
- tapOn: Look up a missing word
- assertNotVisible: 'Steps: 2'
- assertVisible: 'Result: FOUND'
- assertVisible: 'Steps: 3'
- assertNotVisible: 'Steps: 2'
- extendedWaitUntil:
      visible: 'Failed: No entry for missing'
      timeout: 14000
- assertNotVisible: 'Result: FOUND'
- assertNotVisible: 'Steps: 3'
- assertVisible: 'Failed: No entry for missing'
- assertNotVisible: 'Result: FOUND'
- assertNotVisible: 'Steps: 3'
