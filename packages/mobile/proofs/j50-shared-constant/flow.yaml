appId: ${APP_ID}
name: j50-shared-constant
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- assertVisible: Sizes
- assertVisible: Sizes Small and Large
- assertVisible: Chosen Small
- assertNotVisible: Chosen Large
- tapOn: Switch size
- assertVisible: Chosen Large
- assertNotVisible: Chosen Small
- assertVisible: Chosen Large
- assertNotVisible: Chosen Small
