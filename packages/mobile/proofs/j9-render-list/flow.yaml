    text: date
    below: fig
- assertVisible:
    text: kiwi
    below: date
- assertVisible:
    text: banana
    below: kiwi
- assertVisible: date
- assertVisible:
    text: date
    below: fig
- assertVisible:
    text: kiwi
    below: date
- assertVisible:
    text: banana
    below: kiwi
