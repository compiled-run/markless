- assertNotVisible: Home page
- assertNotVisible: Pump house
- assertNotVisible: East fence
- assertVisible: Settings
- tapOn: Change site
- assertVisible: Pump house
- assertVisible: East fence
- assertVisible: Pump house
- assertVisible: East fence
- tapOn: East fence
- assertNotVisible: Pump house
- assertVisible: East fence
- assertVisible: Change site
- assertNotVisible: North yard
- assertNotVisible: Pump house
- runFlow:
      when:
          platform: iOS
      commands:
          - tapOn:
                id: BackButton
- runFlow:
      when:
          platform: Android
      commands:
          - pressKey: back
- assertVisible: Home
- assertVisible: Home page
- assertVisible: Working at East fence
- assertNotVisible: Working at North yard
- assertVisible: Home
