appId: ${APP_ID}
name: n4-deep-link
---
- launchApp:
      clearState: true
- stopApp
- openLink: markless-proof://app/orders/42
- runFlow:
      when:
          platform: iOS
      commands:
          - tapOn:
                text: Open
                optional: true
- assertVisible: Details for order 42
- assertNotVisible: Your orders
- assertNotVisible: Shop front
- assertVisible: Order 42
- runFlow:
      when:
          platform: iOS
      commands:
          - tapOn:
                id: BackButton
- runFlow:
      when:
          platform: Android
      commands:
          - pressKey: back
- assertVisible: Your orders
- assertNotVisible: Details for order 42
- assertVisible: Orders
- assertVisible: Your orders
- assertVisible: Desk lamp
- assertVisible: Oak chair
- assertNotVisible: Details for order 42
- assertVisible: Orders
- swipe:
      start: 1%, 50%
      end: 85%, 50%
      duration: 400
- assertNotVisible: Your orders
- assertVisible: Shop
- assertVisible: Shop front
- assertVisible: See orders
- assertNotVisible: Your orders
- assertVisible: Shop
- tapOn: See orders
- assertVisible: Your orders
- assertNotVisible: Shop front
- assertVisible: Orders
- assertVisible: Your orders
- assertVisible: Oak chair
- assertNotVisible: Shop front
- assertVisible: Orders
