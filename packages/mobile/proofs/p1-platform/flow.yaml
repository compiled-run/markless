appId: ${APP_ID}
name: p1-platform
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- assertVisible: Platform
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Built for iOS
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: Built for Android
