- launchApp
- assertVisible: Lists
- assertVisible: Seeds
- assertVisible: Soil
- assertVisible: Sow
- assertVisible: Water
- assertVisible: Basil
- assertVisible: Likes sun
- assertVisible: Mint
- assertVisible: Likes shade
- assertVisible:
    text: Soil
    below: Seeds
- assertVisible:
    text: Sow
    below: Soil
- assertVisible:
    text: Water
    below: Sow
- assertVisible:
    text: Basil
    below: Water
- assertVisible:
    text: Likes sun
    below: Basil
- assertVisible:
    text: Mint
    below: Likes sun
- assertVisible:
    text: Likes shade
    below: Mint
