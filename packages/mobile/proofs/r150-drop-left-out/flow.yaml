appId: ${APP_ID}
name: r150-drop-left-out
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- assertVisible: Upload
- assertVisible: Nothing picked
- assertVisible: Pick a photo
- assertNotVisible: Picked a photo
- tapOn: Pick a photo
- assertVisible: Picked a photo
- assertNotVisible: Nothing picked
- assertVisible: Picked a photo
- assertNotVisible: Nothing picked
