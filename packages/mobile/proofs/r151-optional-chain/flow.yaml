- assertVisible: "Name: Sam"
- assertVisible: "City: Lyon"
- assertNotVisible: "Name: nobody"
- tapOn: Sign out
- assertVisible: "Name: nobody"
- assertNotVisible: "Name: Sam"
- assertVisible: "Name: nobody"
- assertVisible: "City: unknown"
- assertNotVisible: "Name: Sam"
