appId: ${APP_ID}
name: s12-no-font-family
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- assertVisible: Field notes
- assertVisible: "No font-family anywhere: the browser's default serif, on the web
    and on the phone"
- assertVisible: Waffles, quays and fjords
- assertVisible: Notes
