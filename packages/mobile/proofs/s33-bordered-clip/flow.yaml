- assertVisible: Opened 1
- assertNotVisible: Opened 0
- assertVisible: Opened 1
- assertVisible: Basil, inside the border
- assertVisible: Thyme, uneven sides
- assertNotVisible: Opened 0
- assertVisible: Cards
