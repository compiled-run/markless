appId: ${APP_ID}
name: s34-sticky-tap
---
- launchApp:
      clearState: true
- assertVisible: Sticky header
- assertVisible: Header taps 0
- assertVisible: Button taps 0
- assertVisible: Picked none
- assertVisible: Row 1
- assertVisible: Sticky tap
- repeat:
      times: 80
      while:
          notVisible: Row 30
      commands:
          - swipe:
                start: 50%, 80%
                end: 50%, 25%
- assertNotVisible: Row 1
- assertVisible: Sticky header
- assertVisible: Header taps 0
- assertVisible: Button taps 0
- assertVisible: Picked none
- assertVisible: Row 30
- assertNotVisible: Row 1
- tapOn: Header button
- assertNotVisible: Header taps 0
- assertNotVisible: Button taps 0
- assertVisible: Header taps 1
- assertVisible: Button taps 1
- assertVisible: Picked none
- assertNotVisible: Header taps 0
- assertNotVisible: Button taps 0
- tapOn:
      point: 80%,10%
- assertNotVisible: Header taps 1
- assertVisible: Header taps 2
- assertVisible: Button taps 1
- assertVisible: Picked none
- assertNotVisible: Header taps 1
- tapOn: Row 30
- assertNotVisible: Picked none
- assertVisible: Header taps 2
- assertVisible: Button taps 1
- assertVisible: Picked Row 30
- assertNotVisible: Picked none
