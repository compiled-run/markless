- assertVisible: Tap button
- assertVisible: Pick red
- tapOn: Tally
- assertNotVisible: Header taps 0 · Button taps 0 · Picked none
- assertVisible: Header taps 1 · Button taps 0 · Picked none
- assertNotVisible: Header taps 0 · Button taps 0 · Picked none
- tapOn: Tap button
- assertNotVisible: Header taps 1 · Button taps 0 · Picked none
- assertVisible: Header taps 1 · Button taps 1 · Picked none
- assertVisible: 1 by button
- assertNotVisible: Header taps 1 · Button taps 0 · Picked none
- assertNotVisible: 0 by button
- tapOn: Pick red
- assertNotVisible: Header taps 1 · Button taps 1 · Picked none
- assertVisible: Header taps 1 · Button taps 1 · Picked red
- assertVisible: red, the colour the last tap on Pick red chose for the rest of
      this page and every row
