appId: ${APP_ID}
name: s5-page-canvas
---
- launchApp:
      clearState: true
- setDarkMode: disabled
- assertVisible: Seed tray
- assertVisible: Open notes
- assertVisible: Garden
- tapOn: Open notes
- assertNotVisible: Seed tray
- assertVisible: Notes
- assertVisible: Watering
- assertVisible: Mist the tray each morning
- assertNotVisible: Seed tray
- assertVisible: Notes
- setDarkMode: enabled
- assertVisible: Watering
- assertVisible: Mist the tray each morning
- assertVisible: Notes
- runFlow:
      when:
          platform: iOS
      commands:
          - tapOn:
                id: BackButton
- runFlow:
      when:
          platform: Android
      commands:
          - pressKey: back
- assertNotVisible: Watering
- assertVisible: Garden
- assertVisible: Seed tray
- assertVisible: Open notes
- assertNotVisible: Watering
- assertVisible: Garden
- setDarkMode: disabled
- assertVisible: Seed tray
- assertVisible: Open notes
- assertVisible: Garden
