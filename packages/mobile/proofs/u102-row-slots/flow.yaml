appId: ${APP_ID}
name: u102-row-slots
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- assertVisible: Row numbers
- assertVisible: Alpha row
- assertVisible: Beta row
- assertVisible: Lift beta
- assertVisible:
    text: Beta row
    below: Alpha row
- tapOn: Lift beta
- assertVisible:
    text: Alpha row
    below: Beta row
- assertVisible: Alpha row
- assertVisible: Beta row
- assertVisible:
    text: Alpha row
    below: Beta row
