appId: ${APP_ID}
name: u137-fileupload
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp:
    arguments:
      pick: '[{"name":"note.txt","text":"hello","type":"text/plain"}]'
- assertVisible: Upload
- assertVisible: Attachments
- assertVisible: Browse
- assertVisible: 0 chosen
- tapOn: Browse
- assertNotVisible: 0 chosen
- assertVisible: 1 chosen
- assertVisible: note\.txt
- assertVisible: Remove
- assertNotVisible: 0 chosen
- tapOn: Remove
- assertVisible: 0 chosen
- assertNotVisible: 1 chosen
- assertNotVisible: note\.txt
- assertVisible: 0 chosen
- assertNotVisible: 1 chosen
- assertNotVisible: note\.txt
