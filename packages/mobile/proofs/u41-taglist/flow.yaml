appId: ${APP_ID}
name: u41-taglist
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- assertVisible: Pantry
- assertVisible: "Tags: tea"
- assertVisible: ""
- tapOn: Topics
- inputText: milk
- hideKeyboard
- assertVisible: milk
- assertVisible: "Tags: tea"
- assertVisible: milk
- tapOn: Topics
- pressKey: Enter
- assertNotVisible: "Tags: tea"
- assertVisible: ""
- assertVisible: "Tags: tea, milk"
- assertNotVisible: "Tags: tea"
- assertVisible: ""
- tapOn: Topics
- inputText: sugar,
- hideKeyboard
- assertNotVisible: "Tags: tea, milk"
- assertVisible: "Tags: tea, milk, sugar"
- assertNotVisible: "Tags: tea, milk"
- assertVisible: ""
