    text: Item two
    below: Item one
- assertVisible:
    text: Moving item
    below: Item two
- assertVisible: Rank 1
- assertNotVisible: Rank -1
- assertVisible:
    text: Item two
    below: Item one
- assertVisible:
    text: Moving item
    below: Item two
