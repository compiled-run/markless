appId: ${APP_ID}
name: z4-sheet-dark-mode
---
- runFlow:
    when:
      platform: Android
    commands:
      - clearState
- launchApp
- setDarkMode: disabled
- assertVisible: Journal
- assertVisible: Read today
- assertNotVisible: Today
- assertNotVisible: Walked by the river
- setDarkMode: enabled
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Journal
- assertVisible: Read today
- assertNotVisible: Today
- assertNotVisible: Walked by the river
- tapOn: Read today
- assertVisible: Today
- assertVisible: Walked by the river
- assertVisible: Today
- assertVisible: Walked by the river
- setDarkMode: disabled
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Today
- assertVisible: Walked by the river
- setDarkMode: enabled
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Today
- assertVisible: Walked by the river
